/* 布局：像一款手机上的经营游戏。顶上是日头和存粮，中间是一张张人物卡，夜里换成围坐在火边的一圈人；
   事件和夜谈是全屏的画加对话框。底部是菜单和当天要做的那一步。
   只做一套深色：白天是灯下的暖褐，夜里是冷蓝，这是一个发生在冬夜里的游戏。 */
:root, .hanyi {
  color-scheme: dark;
  --ink: #0f151c;
  --ink-2: #151d27;
  --ink-3: #1d2833;
  --rule: #2a3846;
  --snow: #e7ebee;
  --frost: #9aabb9;
  --dim: #66788a;
  --paper: #f5ece0;
  --card-paper: #efe4d2;
  --ember: #ee8d4a;
  --ember-ink: #1b0f06;
  --ember-soft: rgba(238, 141, 74, 0.13);
  --good: #8fc29a;
  --warn: #e6b95c;
  --bad: #e8705f;
  --scrim: rgba(4, 7, 11, 0.72);
  --font-display: "Ma Shan Zheng", "STXingkai", "Kaiti SC", "KaiTi", "STKaiti", serif;
  --font-story: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --font-ui: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --r: 12px;
  --dock-h: 74px;
}
/* 白天、傍晚：灯下的暖色；夜里沿用上面的冷色 */
:root[data-phase="day"], .hanyi[data-phase="day"] {
  --ink: #15110d; --ink-2: #1e1913; --ink-3: #2a231b; --rule: #3b3127;
  --frost: #b9ab95; --dim: #857764;
}
:root[data-phase="evening"], .hanyi[data-phase="evening"] {
  --ink: #16110f; --ink-2: #201815; --ink-3: #2c221d; --rule: #40302a;
  --frost: #bba796; --dim: #8a7466;
}

* { box-sizing: border-box; }
html, body { background: var(--ink); color: var(--snow); margin: 0; }
body, .hanyi {
  font-family: var(--font-ui); font-size: 15px; line-height: 1.55;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  background-color: var(--ink);
  background-image: radial-gradient(130% 55% at 50% -12%, color-mix(in srgb, var(--ember) 7%, transparent), transparent 62%);
  background-attachment: fixed;
}
/* 人物和背景都是像素画：放大时保持硬边（这个属性会继承给所有子元素） */
.hanyi { image-rendering: crisp-edges; image-rendering: pixelated; }
html.lock, html.lock body { overflow: hidden; }
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--ink);
}
/* 天工引擎版：界面挂在 #game-ui 里，作为一层可滚动的全屏面板 */
.hanyi-scroll { position: fixed; inset: 0; overflow-y: auto; overscroll-behavior: contain; z-index: 10; pointer-events: auto; }
.hanyi-scroll.lock { overflow: hidden; }

:where(.hanyi) button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:where(.hanyi) button:disabled { cursor: not-allowed; }
:where(.hanyi) :focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; border-radius: 6px; }
:where(.hanyi) :is(h1, h2, h3) { text-wrap: balance; margin: 0; font-weight: 600; }
:where(.hanyi) p { margin: 0; }
:where(.hanyi) figure { margin: 0; }
:where(.hanyi) code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; color: var(--frost); background: var(--ink-3); padding: 1px 5px; border-radius: 4px; }

.wrap {
  max-width: 680px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.ico { width: 1.05em; height: 1.05em; fill: currentColor; vertical-align: -0.17em; margin-right: 0.3em; flex: none; }
.ico.big { display: block; width: 24px; height: 24px; margin: 0 0 3px; color: var(--ember); opacity: 0.9; }
.mini { font-size: 12px; color: var(--dim); }
.mini.err { color: var(--warn); }

/* ───── 人物形象 ─────
   48×48 的像素半身像。::after 是闭眼的那一帧，隔几秒闪一下就是眨眼。 */
.pt {
  display: block; aspect-ratio: 1; position: relative;
  /* 只用分写属性：简写 background 会把 .pt-<角色> 设好的图清掉 */
  background-position: center bottom; background-size: 100% auto; background-repeat: no-repeat;
}
.pt::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; border-radius: inherit;
  background-image: var(--blink, none); background-size: inherit; background-position: inherit; background-repeat: no-repeat;
  animation: pt-blink var(--blink-dur, 5s) step-end var(--blink-delay, 0s) infinite;
}
@keyframes pt-blink { 0% { opacity: 0; } 96% { opacity: 1; } 98.6% { opacity: 0; } }
.gone .pt::after { display: none; }
.pt.mini { width: 26px; height: 26px; border-radius: 50%; background-color: color-mix(in srgb, var(--c) 30%, var(--card-paper)); background-size: 118% auto; background-position: center 110%; flex: none; box-shadow: 0 0 0 1.5px var(--ink-2); }
.pt.head { width: 52px; border-radius: 12px; background-color: color-mix(in srgb, var(--c) 28%, var(--card-paper)); flex: none; }

/* ───── 顶部：日头与存粮 ───── */
.hud {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--ink); border-bottom: 1px solid var(--rule); overflow: hidden;
}
.hud .wrap { position: relative; z-index: 1; padding-block: 10px; display: grid; gap: 10px; }
.hud-art { position: absolute; inset: 0; }
/* 画和调色在 ::before 上，渐隐在 ::after 上，调色不会染到渐隐的颜色 */
.hud-art::before { content: ""; position: absolute; inset: 0; background: var(--art-retreat) center 62% / cover no-repeat; opacity: 0.66; }
.hud-art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0, 0, 0, 0.05), color-mix(in srgb, var(--ink) 60%, transparent) 55%, var(--ink) 100%); }
.hud[data-phase="evening"] .hud-art::before { filter: sepia(0.5) saturate(1.3) brightness(0.72) hue-rotate(-12deg); }
.hud[data-phase="night"] .hud-art::before { background-image: var(--art-inn); background-position: center 30%; filter: brightness(0.62) saturate(0.4) hue-rotate(180deg); opacity: 0.6; }
.hud-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.hud-day { display: grid; gap: 2px; min-width: 0; }
.hud-day b { font-family: var(--font-display); font-weight: 400; font-size: 32px; line-height: 1; color: var(--paper); white-space: nowrap; text-shadow: 0 1px 12px rgba(0, 0, 0, 0.6); }
.hud-day span, .hud-sky span { color: var(--frost); font-size: 12px; white-space: nowrap; text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7); }
.hud-sky { display: grid; gap: 2px; justify-items: end; text-align: right; color: inherit; }
.hud-sky strong { font-size: 17px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; text-shadow: 0 1px 10px rgba(0, 0, 0, 0.6); }
.hud-sky strong .ico { color: var(--warn); }
.hud-sky .storm { color: var(--bad); }
.caps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.cap {
  display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 6px; align-items: center;
  padding: 6px 9px; border-radius: 999px 14px 14px 999px;
  background: color-mix(in srgb, var(--ink-2) 84%, transparent); backdrop-filter: blur(3px);
  border: 1px solid color-mix(in srgb, var(--rule) 70%, transparent); min-width: 0; width: 100%; text-align: left;
}
.cap .ico { grid-row: 1 / 3; width: 24px; height: 24px; margin: 0; color: var(--ember); }
.cap b { font-size: 18px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.cap i { font-style: normal; font-size: 11px; color: var(--frost); font-variant-numeric: tabular-nums; grid-column: 2; grid-row: 1; justify-self: end; }
.cap i.neg { color: var(--bad); }
.cap i.pos { color: var(--good); }
.cap small { font-size: 10.5px; color: var(--dim); letter-spacing: 0.08em; line-height: 1.2; }
.cap.short b { color: var(--bad); }

main .wrap { padding-block: 14px calc(var(--dock-h) + 36px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
.sec { font-size: 12px; color: var(--dim); letter-spacing: 0.18em; font-weight: 500; margin-top: 2px; }

/* ───── 通用块 ───── */
.note { border: 1px solid var(--rule); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 8px; background: color-mix(in srgb, var(--ink-2) 92%, transparent); }
.note h3 { font-size: 13px; color: var(--frost); letter-spacing: 0.12em; font-weight: 500; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.note h3 button { font-size: 12px; color: var(--ember); letter-spacing: 0; }
.note ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.note li { font-size: 14px; padding-left: 12px; position: relative; }
.note li::before { content: ""; position: absolute; left: 0; top: 0.7em; width: 5px; height: 1px; background: var(--dim); }
.note li.good { color: var(--good); }
.note li.bad { color: var(--bad); }
.note li.story { color: var(--paper); }
.note.tip { border-style: dashed; background: transparent; }
.note.tip p { font-size: 13.5px; color: var(--frost); }
.note.tip b { color: var(--snow); font-weight: 600; }
.note.credits p { line-height: 1.7; }
.plan { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.plan > div { min-width: 0; }
.plan small { display: block; font-size: 11px; color: var(--dim); letter-spacing: 0.1em; margin-bottom: 4px; }
.seg { display: flex; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
.seg button { flex: 1; padding: 7px 4px; font-size: 13px; color: var(--frost); }
.seg button[aria-pressed="true"] { background: var(--ink-3); color: var(--snow); }
.seg button:disabled { opacity: 0.4; }
.forecast { font-size: 13px; color: var(--frost); }
.forecast b { color: var(--snow); font-weight: 600; font-variant-numeric: tabular-nums; }
.forecast .warn { color: var(--warn); }
.adopt-all { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.adopt-all .mini { flex: 1; min-width: 12em; }
.btn { padding: 8px 14px; border-radius: 10px; border: 1px solid var(--rule); font-size: 14px; background: var(--ink-3); }
.btn.hot { background: var(--ember); border-color: var(--ember); color: var(--ember-ink); font-weight: 600; }
.btn:disabled { opacity: 0.45; }
.btn.ghost { background: transparent; }
.mini-btn { flex: none; padding: 3px 10px; border-radius: 14px; border: 1px solid color-mix(in srgb, var(--ember) 60%, transparent); color: var(--ember); font-size: 12px; }
.chip { font-size: 11px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--rule); color: var(--frost); white-space: nowrap; }
.chip.bad { border-color: color-mix(in srgb, var(--bad) 55%, transparent); color: var(--bad); }
.chip.warn { border-color: color-mix(in srgb, var(--warn) 55%, transparent); color: var(--warn); }
.chip.good { border-color: color-mix(in srgb, var(--good) 55%, transparent); color: var(--good); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* ───── 人物卡 ───── */
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.card {
  display: grid; grid-template-rows: auto 1fr;
  border-radius: 16px; overflow: hidden; min-width: 0;
  background: var(--ink-2); border: 1px solid var(--rule);
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
}
.card-face {
  position: relative; display: block; width: 100%;
  aspect-ratio: 1 / 0.88;
  background:
    radial-gradient(90% 70% at 50% 30%, color-mix(in srgb, var(--c) 18%, var(--card-paper)), color-mix(in srgb, var(--c) 42%, #cdbb9f));
  border-bottom: 3px solid var(--c);
  overflow: hidden;
}
.card-face .pt { position: absolute; left: 50%; bottom: 0; width: 84%; transform: translateX(-50%); }
.card-face:hover .pt { transform: translateX(-50%) scale(1.03); transition: transform 0.2s ease; }
.card-tags { position: absolute; left: 6px; top: 6px; display: grid; gap: 3px; justify-items: start; }
.tag { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--bad); color: #fff; font-weight: 600; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3); }
.tag.warn { background: var(--warn); color: #2b1d05; }
.say-bubble {
  position: absolute; right: 7px; top: 8px; max-width: 72%;
  padding: 4px 9px; border-radius: 12px 12px 3px 12px;
  background: #fffaf2; color: #2a2118; font-size: 12px; font-weight: 600; line-height: 1.35;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
}
.say-bubble.asking { color: #8a7a66; font-weight: 400; }
.say-bubble.ok { background: #e4f1e6; color: #24412b; }
.say-bubble.want { background: var(--ember); color: var(--ember-ink); animation: nudge 2.4s ease-in-out infinite; }
@keyframes nudge { 0%, 85%, 100% { transform: translateY(0); } 90% { transform: translateY(-3px); } 95% { transform: translateY(0); } }
.card-body { display: grid; gap: 7px; padding: 9px 10px 10px; align-content: start; min-width: 0; }
.card-name { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.card-name b { font-size: 16px; font-weight: 700; white-space: nowrap; }
.card-name span { font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.card-bars { display: grid; gap: 3px; width: 100%; text-align: left; border-radius: 6px; }
.bar { display: grid; grid-template-columns: 2.2em minmax(0, 1fr) 2.6em; align-items: center; gap: 6px; font-size: 10.5px; color: var(--dim); }
.bar i { display: block; height: 5px; border-radius: 3px; background: var(--ink-3); overflow: hidden; }
.bar i::after { content: ""; display: block; height: 100%; width: var(--v); background: var(--fill, var(--frost)); border-radius: 3px; }
.bar em { font-style: normal; text-align: right; color: var(--frost); font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar.h { --fill: var(--good); }
.bar.s { --fill: #7fa7c9; }
.bar.m { --fill: var(--ember); }
.bar.low { --fill: var(--bad); }
.bar.low em { color: var(--bad); }
.card-say { display: flex; align-items: flex-start; gap: 6px; }
.card-say p { flex: 1; min-width: 0; font-family: var(--font-story); font-size: 12.5px; line-height: 1.55; color: var(--frost); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-say em.ok { font-style: normal; font-size: 11px; color: var(--good); white-space: nowrap; padding-top: 2px; }
.task-btn {
  display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 7px; align-items: center; text-align: left;
  padding: 7px 9px; border-radius: 11px; border: 1px solid var(--rule); background: var(--ink-3); width: 100%;
}
.task-btn .ico { grid-row: 1 / 3; width: 24px; height: 24px; margin: 0; color: var(--ember); }
.task-btn b { font-size: 14.5px; font-weight: 700; }
.task-btn small { font-size: 10.5px; color: var(--frost); line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
button.task-btn:hover { border-color: var(--dim); }
.task-btn.static { background: transparent; }
.task-btn.talk { border-color: color-mix(in srgb, var(--ember) 55%, transparent); }
.task-btn.talk b { color: var(--ember); }
.task-btn.want { background: var(--ember-soft); border-color: var(--ember); }
.task-btn.done { opacity: 0.5; }
.card.gone { opacity: 0.6; }
.card.gone .card-face { filter: grayscale(1) brightness(0.7); }
.card-end { font-size: 12px; color: var(--dim); }

/* ───── 围炉：大家围坐在火边 ───── */
.campfire {
  position: relative; overflow: hidden; border-radius: 18px; border: 1px solid var(--rule);
  background: radial-gradient(120% 80% at 50% 100%, rgba(238, 141, 74, 0.3), transparent 62%), var(--ink-2);
  padding: 14px 12px 14px; display: grid; gap: 12px;
}
.campfire-art {
  position: absolute; inset: 0;
  background: var(--art-moonplum) center 35% / cover no-repeat;
  filter: brightness(0.6) saturate(0.45) hue-rotate(175deg) contrast(1.08); opacity: 0.55;
  -webkit-mask-image: linear-gradient(to bottom, #000 30%, transparent 85%);
  mask-image: linear-gradient(to bottom, #000 30%, transparent 85%);
}
.campfire > :not(.campfire-art) { position: relative; z-index: 1; }
.lines { display: grid; gap: 8px; }
.lines p { display: flex; gap: 8px; align-items: flex-start; font-family: var(--font-story); font-size: 14.5px; line-height: 1.75; }
.lines .faces { display: flex; flex: none; padding-top: 2px; }
.lines .faces .pt + .pt { margin-left: -8px; }
.lines .text { min-width: 0; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.7); }
.lines p.talkline .text { white-space: pre-line; border-left: 2px solid color-mix(in srgb, var(--ember) 50%, transparent); padding-left: 10px; }
.campfire .ai { font-size: 12px; color: var(--frost); }

/* ───── 营建 ───── */
.works { display: grid; gap: 10px; }
.work { border: 1px solid var(--rule); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 6px; background: color-mix(in srgb, var(--ink-2) 92%, transparent); }
.work.on { border-color: color-mix(in srgb, var(--ember) 60%, transparent); background: var(--ember-soft); }
.work.done { opacity: 0.6; }
.work.locked { border-style: dashed; }
.work header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.work h3 { font-size: 16px; }
.work header span { font-size: 12px; color: var(--frost); white-space: nowrap; }
.work p { font-size: 13.5px; color: var(--frost); }
.work .bar { display: block; height: 5px; border-radius: 3px; background: var(--ink-3); overflow: hidden; }
.work .bar i { display: block; height: 100%; background: var(--ember); width: var(--v); }
.work .row { justify-content: space-between; }
.work .why { font-size: 12px; color: var(--dim); }

/* ───── 日志 ───── */
.log { display: grid; gap: 14px; }
.log section { display: grid; gap: 4px; }
.log h3 { font-family: var(--font-display); font-weight: 400; font-size: 22px; color: var(--paper); }
.log p { font-size: 14px; color: var(--frost); padding-left: 12px; border-left: 1px solid var(--rule); }
.log p.story { color: var(--snow); font-family: var(--font-story); }
.log p.good { color: var(--good); }
.log p.bad { color: var(--bad); }

/* ───── 底部菜单 ───── */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  background: color-mix(in srgb, var(--ink) 94%, transparent); backdrop-filter: blur(6px);
  border-top: 1px solid var(--rule);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.dock .wrap { height: var(--dock-h); display: flex; align-items: center; gap: 8px; }
.dock-tabs { display: flex; flex: 1; min-width: 0; }
.dock-tabs button { position: relative; flex: 1; display: grid; justify-items: center; gap: 2px; padding: 6px 2px; color: var(--dim); font-size: 11px; letter-spacing: 0.08em; }
.dock-tabs button .ico { width: 24px; height: 24px; margin: 0; }
.dock-tabs button[aria-selected="true"] { color: var(--ember); }
.dock-tabs .badge { position: absolute; top: 4px; right: calc(50% - 18px); width: 8px; height: 8px; border-radius: 50%; background: var(--ember); box-shadow: 0 0 0 2px var(--ink); }
.go {
  flex: none; display: grid; justify-items: center; gap: 0; min-width: 132px;
  padding: 9px 18px; border-radius: 14px;
  background: var(--ember); color: var(--ember-ink);
  box-shadow: 0 6px 22px rgba(238, 141, 74, 0.3), inset 0 -3px 0 rgba(0, 0, 0, 0.15);
}
.go b { font-size: 16px; font-weight: 800; letter-spacing: 0.12em; }
.go small { font-size: 10.5px; opacity: 0.75; white-space: nowrap; max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
.go small .ico { width: 12px; height: 12px; margin: 0 3px 0 0; vertical-align: -1px; }
.go.risky { background: var(--warn); box-shadow: 0 6px 22px rgba(230, 185, 92, 0.28), inset 0 -3px 0 rgba(0, 0, 0, 0.15); }
.go.risky small { opacity: 0.9; font-weight: 600; }
.go:disabled { background: var(--ink-3); color: var(--dim); box-shadow: none; }

/* ───── 底部弹出面板 ───── */
.scrim { position: fixed; inset: 0; z-index: 40; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; animation: fade 0.18s ease-out; }
@keyframes fade { from { opacity: 0; } }
.sheet {
  width: 100%; max-width: 680px; max-height: 88%;
  overflow-y: auto; overscroll-behavior: contain;
  background: var(--ink-2); border: 1px solid var(--rule); border-bottom: 0;
  border-radius: 18px 18px 0 0;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: grid; gap: 14px; align-content: start;
  animation: rise 0.22s ease-out;
}
@keyframes rise { from { transform: translateY(24px); opacity: 0.4; } }
.sheet-head { display: flex; align-items: center; gap: 12px; }
.sheet-head > div { flex: 1; min-width: 0; }
.sheet-head h2 { font-size: 19px; }
.sheet-head p { font-size: 12.5px; color: var(--frost); }
.x { width: 34px; height: 34px; border-radius: 17px; border: 1px solid var(--rule); color: var(--frost); font-size: 18px; line-height: 1; flex: none; background: color-mix(in srgb, var(--ink-2) 80%, transparent); }
.tasks { display: grid; gap: 6px; }
.task { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; align-items: center; text-align: left; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--rule); }
.task b { font-size: 16px; font-weight: 600; display: grid; justify-items: start; }
.task div { min-width: 0; display: grid; gap: 1px; }
.task span { font-size: 13px; }
.task small { font-size: 11.5px; color: var(--dim); }
.task small.risk { color: var(--warn); }
.task[aria-pressed="true"] { border-color: var(--ember); background: var(--ember-soft); }
.task:disabled { opacity: 0.4; }

/* 人物页：画作做背景，人像站在画前 */
.hero {
  position: relative; height: 230px;
  margin: -18px calc(-1 * max(16px, env(safe-area-inset-right, 0px))) 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  border-radius: 18px 18px 0 0; overflow: hidden;
  background: var(--art) center 40% / cover no-repeat;
}
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0, 0, 0, 0) 40%, var(--ink-2) 100%); }
.hero .hero-pt { position: absolute; z-index: 1; left: 50%; bottom: 0; width: 220px; transform: translateX(-50%); filter: drop-shadow(0 0 2px rgba(255, 250, 240, 0.9)) drop-shadow(0 6px 18px rgba(0, 0, 0, 0.45)); }
.hero-head { margin-top: -6px; text-align: center; }
.hero-head > div { display: grid; gap: 2px; }
.hero-head h2 { font-family: var(--font-display); font-weight: 400; font-size: 28px; color: var(--paper); }
.person-sheet .hero-head .x { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); top: 14px; }
.person-sheet { position: relative; }
.bio { font-family: var(--font-story); font-size: 15px; line-height: 1.85; }
.secret { border-left: 2px solid var(--ember); padding-left: 12px; font-family: var(--font-story); font-size: 14px; color: var(--paper); line-height: 1.8; }
.kv { display: grid; gap: 8px; }
.kv h3 { font-size: 12px; color: var(--dim); letter-spacing: 0.16em; font-weight: 500; }
.traits { display: grid; gap: 6px; }
.traits div { font-size: 13.5px; color: var(--frost); }
.traits b { color: var(--snow); font-weight: 600; margin-right: 6px; }
.skills { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; text-align: center; }
.skills div { background: var(--ink-3); border-radius: 10px; padding: 6px 2px; }
.skills small { display: block; font-size: 11px; color: var(--dim); }
.skills b { font-size: 18px; font-variant-numeric: tabular-nums; }
.rels { display: grid; gap: 6px; }
.rel { display: grid; grid-template-columns: 52px minmax(0, 1fr) 54px; gap: 10px; align-items: center; font-size: 13px; }
.rel span:last-child { text-align: right; color: var(--frost); }
.rel .track { height: 4px; background: var(--ink-3); border-radius: 2px; position: relative; }
.rel .track::before { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--dim); }
.rel .track i { position: absolute; top: 0; bottom: 0; border-radius: 2px; }

/* 灵魂面板（天工版） */
.soul { border-top: 1px solid var(--rule); padding-top: 12px; }
.soul-id { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.perceive { display: grid; grid-template-columns: 3em minmax(0, 1fr); gap: 4px 10px; margin: 0; font-size: 13px; }
.perceive dt { color: var(--dim); }
.perceive dd { margin: 0; min-width: 0; }
.soul-aff { display: grid; gap: 6px; }
.soul-aff small { font-size: 11px; color: var(--dim); letter-spacing: 0.1em; }
.soul-aff div { display: flex; flex-wrap: wrap; gap: 4px; }

/* ───── 事件与夜谈：全屏的画，人物站在对话框上 ───── */
.vn { align-items: stretch; flex-direction: column; justify-content: flex-end; background: #05080b; }
.vn-bg { position: absolute; inset: 0; background: var(--art) center 40% / cover no-repeat; filter: brightness(0.62) saturate(0.85); }
.vn-bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(5, 8, 11, 0.15) 0%, rgba(5, 8, 11, 0.1) 35%, rgba(5, 8, 11, 0.75) 72%, #05080b 100%); }
.vn-bg.night { filter: brightness(0.5) saturate(0.45) hue-rotate(175deg); }
.vn-stage {
  position: relative; z-index: 1; display: flex; justify-content: center; align-items: flex-end;
  gap: 0; margin-bottom: -1px; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.vn-stage figure { position: relative; width: min(46vw, 230px); }
.vn-stage figure.second { width: min(38vw, 190px); margin-left: -28px; opacity: 0.95; }
.vn-stage .pt { width: 100%; filter: drop-shadow(0 0 2px rgba(255, 250, 240, 0.95)) drop-shadow(0 8px 22px rgba(0, 0, 0, 0.55)); }
.vn-stage figcaption {
  position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%);
  padding: 2px 12px; border-radius: 999px; background: var(--c, var(--ember)); color: #fff; font-size: 12.5px; font-weight: 700; letter-spacing: 0.1em;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4); white-space: nowrap;
}
.vn-box {
  position: relative; z-index: 2; margin: 0 auto; max-height: 62%;
  background: linear-gradient(to bottom, color-mix(in srgb, var(--ink-2) 92%, transparent), var(--ink-2) 40%);
  border-top: 1px solid color-mix(in srgb, var(--ember) 35%, var(--rule));
  box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.45);
  gap: 12px;
}
.vn-title { font-family: var(--font-display); font-weight: 400; font-size: 30px; color: var(--paper); line-height: 1.15; }
.story { font-family: var(--font-story); font-size: 16px; line-height: 1.9; white-space: pre-line; }
.choices { display: grid; gap: 8px; }
.choice { text-align: left; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--rule); background: var(--ink-3); display: grid; gap: 2px; }
.choice b { font-size: 15px; font-weight: 600; }
.choice small { font-size: 12px; color: var(--frost); }
.choice:hover:not(:disabled) { border-color: var(--ember); }
.choice:disabled { opacity: 0.42; }
.step { font-size: 12px; color: var(--dim); letter-spacing: 0.1em; }

.chat-vn .vn-stage figure { width: min(52vw, 240px); }
.chat-box { max-height: 60%; }
.chat-head .vn-title { font-size: 26px; }
.chat { display: grid; gap: 10px; }
.bubble { max-width: 86%; padding: 9px 12px; border-radius: 14px; font-size: 15px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
.bubble.them { justify-self: start; background: #f3eadc; color: #241c14; font-family: var(--font-story); border-top-left-radius: 4px; }
.bubble.me { justify-self: end; background: var(--ember-soft); border: 1px solid color-mix(in srgb, var(--ember) 40%, transparent); border-top-right-radius: 4px; }
.bubble.wait { background: transparent; color: var(--frost); font-family: var(--font-ui); font-size: 13px; padding-left: 0; }
.topics { display: flex; flex-wrap: wrap; gap: 6px; }
.topics button { padding: 7px 12px; border-radius: 16px; border: 1px solid var(--rule); font-size: 13.5px; background: var(--ink-3); }
.topics button:disabled { opacity: 0.4; }
.say { display: flex; gap: 8px; }
.say input { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--rule); background: var(--ink); color: var(--snow); font: inherit; font-size: 16px; }
.say input::placeholder { color: var(--dim); }

/* AI 设置（天工版） */
.ai-card .seg button { padding: 8px 4px; }
.ai-form { display: grid; gap: 8px; }
.ai-form label { display: grid; gap: 4px; font-size: 12px; color: var(--frost); }
.ai-form input { padding: 9px 11px; border-radius: 10px; border: 1px solid var(--rule); background: var(--ink); color: var(--snow); font: inherit; font-size: 15px; min-width: 0; }
.ai-form .btn { justify-self: start; }

/* ───── 标题 ───── */
.title { min-height: 100vh; min-height: 100dvh; position: relative; display: grid; align-content: end; overflow: hidden; }
.title canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.title-art { position: absolute; inset: 0 0 auto 0; height: 82%; background: var(--art-inn) center 18% / cover no-repeat; }
.title-art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(15, 21, 28, 0.05) 0%, rgba(15, 21, 28, 0.3) 34%, rgba(15, 21, 28, 0.82) 58%, var(--ink) 92%); }
.title .wrap { position: relative; padding-block: 30vh 40px; display: grid; gap: 20px; }
.title h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(84px, 26vw, 140px); line-height: 0.95; color: var(--paper); letter-spacing: 0.04em; text-shadow: 0 2px 22px rgba(0, 0, 0, 0.55); }
.title h1 span { display: block; font-family: var(--font-ui); font-size: 14px; letter-spacing: 0.5em; color: var(--ember); margin-top: 14px; font-weight: 500; }
.title .story { max-width: 34em; }
.title .go { min-width: 0; padding: 13px 28px; }
.title .go b, .title .go { font-size: 16px; font-weight: 800; letter-spacing: 0.12em; }
.title .mini { max-width: 34em; line-height: 1.6; }
.art-credit { font-size: 11px; color: var(--dim); letter-spacing: 0.04em; }
.cast { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; max-width: 480px; }
.cast figure { display: grid; gap: 3px; justify-items: center; }
.cast .pt { width: 100%; border-radius: 12px; background-color: color-mix(in srgb, var(--c) 26%, var(--card-paper)); border-bottom: 2px solid var(--c); }
.cast figcaption { font-size: 11px; color: var(--frost); }
.cast .unknown .pt { background-color: var(--ink-3); border-bottom-color: var(--rule); filter: brightness(0.9); }

/* ───── 结局 ───── */
.ending { position: relative; overflow: hidden; }
.ending-art { height: 62vh; }
.ending-art.wiped::before { content: ""; position: absolute; inset: 0; background: inherit; filter: grayscale(1) brightness(0.55); }
.ending .wrap { position: relative; padding-block: 32vh calc(40px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 22px; }
.ending h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(48px, 13vw, 72px); color: var(--paper); line-height: 1.05; text-shadow: 0 2px 22px rgba(0, 0, 0, 0.55); }
.ending .story { line-height: 1.95; }
.tally { display: flex; gap: 18px; flex-wrap: wrap; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding-block: 12px; }
.tally div small { display: block; font-size: 11px; color: var(--dim); letter-spacing: 0.1em; }
.tally div b { font-size: 22px; font-variant-numeric: tabular-nums; }
.fates { display: grid; gap: 16px; margin: 0; padding: 0; list-style: none; }
.fates li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: start; }
.fates li > div { display: grid; gap: 6px; min-width: 0; }
.fates .pt { width: 64px; border-radius: 14px; background-color: color-mix(in srgb, var(--c) 26%, var(--card-paper)); border-bottom: 3px solid var(--c); }
.fates .gone .pt { filter: grayscale(1) brightness(0.65); }
.fates .p-head { display: flex; align-items: baseline; gap: 6px 8px; flex-wrap: wrap; }
.fates .p-head b { font-size: 16px; }
.fates p { font-family: var(--font-story); font-size: 14.5px; line-height: 1.8; color: var(--frost); }
.ending .go { justify-self: start; padding: 13px 28px; }

.still { animation: none !important; }

/* 引擎宿主在窄屏底部中间显示帧率，给它留出位置 */
@media (max-width: 600px) {
  .hanyi-scroll .dock .wrap { height: auto; padding-block: 8px 52px; }
  .hanyi-scroll main .wrap { padding-bottom: calc(var(--dock-h) + 90px + env(safe-area-inset-bottom, 0px)); }
  .hanyi-scroll .sheet { padding-bottom: calc(60px + env(safe-area-inset-bottom, 0px)); }
}
@media (max-width: 360px) {
  .cards { gap: 8px; }
  .card-body { padding: 8px; }
  .go { min-width: 112px; padding: 8px 12px; }
}
/* ───── 驿站场景：整数倍放大的像素画，手机上铺满整个宽度 ───── */
.scene-box { position: relative; overflow: hidden; border-radius: 16px; border: 1px solid var(--rule); background: #0b1018; }
.scene-box canvas { display: block; image-rendering: pixelated; touch-action: manipulation; }
.scene-hint {
  position: absolute; right: 8px; bottom: 6px; padding: 2px 8px; border-radius: 999px; pointer-events: none;
  font-size: 11px; color: var(--paper); background: rgba(10, 12, 16, 0.55); letter-spacing: 0.06em;
}
@media (max-width: 600px) {
  .scene-box { margin: -14px calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 0; border-radius: 0; border-width: 0 0 1px; }
}

/* ───── 按下去的手感 ───── */
:where(.hanyi) button:not(:disabled):active { transform: translateY(1px) scale(0.98); }

/* ───── 声音开关 ───── */
.snd {
  display: inline-grid; place-items: center; width: 30px; height: 30px; margin-left: 8px; vertical-align: 4px;
  border-radius: 9px; color: var(--frost); background: color-mix(in srgb, var(--ink-2) 72%, transparent);
  border: 1px solid color-mix(in srgb, var(--rule) 70%, transparent); text-shadow: none;
}
.snd .ico { width: 24px; height: 24px; margin: 0; }
.snd[aria-pressed="false"] { color: var(--dim); }
.title-snd { position: absolute; z-index: 2; top: calc(env(safe-area-inset-top, 0px) + 14px); right: 16px; margin: 0; }
.settings .row { display: flex; flex-wrap: wrap; gap: 8px; }
.settings .btn .ico { width: 12px; height: 12px; margin-right: 6px; vertical-align: -1px; }

/* ───── 像素雪：canvas 只有屏幕三分之一的分辨率，放大后就是一颗颗方块 ───── */
.snowfx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.hud .snowfx { z-index: 0; opacity: 0.85; }
.chat-vn .snowfx { opacity: 0.55; }

/* ───── 结束今天之前的提醒 ───── */
.risks { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 8px; }
.risks li { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; background: var(--ink-3); }
.risks li .ico { width: 24px; height: 24px; margin: 0; flex: none; color: var(--frost); }
.risks li.bad { box-shadow: inset 3px 0 0 var(--bad); }
.risks li.bad .ico { color: var(--bad); }
.risks li.warn { box-shadow: inset 3px 0 0 var(--warn); }
.risks li.warn .ico { color: var(--warn); }
.risks li p { font-size: 13.5px; line-height: 1.6; }
.end-row { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 4px; }

/* ───── 点开数字看说明 ───── */
.info-sheet > p { font-size: 14px; line-height: 1.75; }
.info-sheet > p b { color: var(--ember); font-weight: 600; margin-right: 4px; }
.info-sheet .today { padding: 10px 12px; border-radius: 10px; background: var(--ember-soft); color: var(--paper); }
.info-ico .ico { display: block; width: 36px; height: 36px; margin: 0; color: var(--ember); }

/* ───── 教学 ───── */
.coach {
  position: fixed; z-index: 30; left: 50%; transform: translateX(-50%);
  bottom: calc(var(--dock-h) + 12px + env(safe-area-inset-bottom, 0px));
  width: min(calc(100% - 24px), 520px); padding: 12px 14px 12px; border-radius: 14px;
  background: var(--card-paper); color: #2a1f16;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55), 0 0 0 2px var(--ember);
  animation: coach-in 0.3s ease-out;
}
.coach h3 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 15px; margin-bottom: 4px; color: #2a1f16; }
.coach h3 small { font-size: 11px; font-weight: 400; color: #8a7462; }
.coach p { font-size: 13.5px; line-height: 1.65; color: #4a3b2e; }
.coach .row { display: flex; gap: 8px; margin-top: 10px; }
.coach .btn.ghost { color: #6a5646; border-color: rgba(0, 0, 0, 0.18); background: transparent; }
@keyframes coach-in { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
.coach-target { outline: 3px solid var(--ember); outline-offset: 3px; animation: coach-pulse 1.4s ease-in-out infinite; }
@keyframes coach-pulse { 0%, 100% { outline-color: var(--ember); } 50% { outline-color: rgba(238, 141, 74, 0.3); } }
@media (max-width: 600px) {
  .hanyi-scroll .coach { bottom: calc(var(--dock-h) + 58px + env(safe-area-inset-bottom, 0px)); }
}

/* ───── 画面反馈层：过场大字卡、飘字 ───── */
.hanyi-fx { position: fixed; inset: 0; z-index: 60; pointer-events: none; overflow: hidden; }
.phase-card { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; animation: phase 1.9s ease-in-out forwards; }
.phase-card > div {
  display: grid; justify-items: center; gap: 8px; width: 100%; padding: 26px 0 22px;
  background: linear-gradient(to right, transparent, rgba(16, 11, 8, 0.86) 18%, rgba(16, 11, 8, 0.86) 82%, transparent);
}
.phase-card b { font-family: var(--font-display); font-weight: 400; font-size: 64px; line-height: 1; color: var(--paper); letter-spacing: 0.12em; text-shadow: 0 2px 20px rgba(0, 0, 0, 0.6); animation: phase-in 1.9s ease-out; }
.phase-card span { font-size: 14px; letter-spacing: 0.4em; color: var(--warn); }
.phase-card.to-evening > div { background: linear-gradient(to right, transparent, rgba(46, 20, 10, 0.88) 18%, rgba(46, 20, 10, 0.88) 82%, transparent); }
.phase-card.to-evening span { color: var(--ember); }
.phase-card.to-night > div { background: linear-gradient(to right, transparent, rgba(9, 16, 30, 0.9) 18%, rgba(9, 16, 30, 0.9) 82%, transparent); }
.phase-card.to-night span { color: #9cc0e6; }
@keyframes phase { 0% { opacity: 0; } 14% { opacity: 1; } 72% { opacity: 1; } 100% { opacity: 0; } }
@keyframes phase-in { 0% { transform: translateY(10px) scale(0.96); letter-spacing: 0.3em; } 22% { transform: none; letter-spacing: 0.12em; } }
.float {
  position: fixed; transform: translate(-50%, 0); font-weight: 800; font-size: 18px; white-space: nowrap;
  font-variant-numeric: tabular-nums; text-shadow: 0 2px 6px rgba(0, 0, 0, 0.85), 0 0 2px #000;
  animation: float-up 1.5s ease-out forwards;
}
.float.pos { color: var(--good); }
.float.neg { color: var(--bad); }
.float.trust { color: #f4a3b8; font-size: 15px; }
@keyframes float-up {
  0% { opacity: 0; transform: translate(-50%, 6px) scale(0.8); }
  15% { opacity: 1; transform: translate(-50%, 0) scale(1.12); }
  30% { transform: translate(-50%, -6px) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -40px); }
}
.cap.bump { animation: bump 0.5s ease-out; }
@keyframes bump { 0% { transform: scale(1); } 30% { transform: scale(1.1); } 100% { transform: scale(1); } }
.card-face .pt.hop { animation: hop 0.45s ease-out; }
@keyframes hop { 0%, 100% { transform: translateX(-50%) translateY(0); } 40% { transform: translateX(-50%) translateY(-7%); } 70% { transform: translateX(-50%) translateY(1%); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<script>"use strict";(()=>{var wa=Object.defineProperty;var Sa=(e,t,n)=>t in e?wa(e,t,{enumerable:!0,configurable:!0,writable:!0,value:n}):e[t]=n;var Wt=(e,t,n)=>Sa(e,typeof t!="symbol"?t+"":t,n);var he={qin:{id:"qin",name:"秦守山",short:"老秦",seal:"秦",gender:"m",age:58,job:"退休护林员",color:"#5f7d5c",traits:["coldproof","loner"],skills:{str:3,wild:5,craft:2,med:1,talk:1},trust:30,mood:50,starter:!0,bio:"在这片山里巡了三十年林。驿站的钥匙一直挂在他脖子上，可他好像并不愿意回到这里。",personality:"沉默寡言，脾气硬，嘴上不饶人，看不惯浪费和城里人的娇气；但会在夜里悄悄起来给别人添柴。",voice:'话很短，常说"嗯""别废话""山里不讲这个"。语气干、硬，带点北方山里人的土气，从不用网络用语。',background:"退休前是这一带的护林员，这座驿站以前就是护林站，他在这里住过十几年。熟悉每一条沟、每一片林子。",secret:"八年前的冬天，他的儿子秦川从这个护林站出发去搜救迷路的驴友，再也没有回来。他一直觉得是自己没拦住儿子。驿站地窖里还存着他当年囤下的物资。",secretTrust:55,lines:{greet:{low:["……别问了，干活去。","这天，熬一天算一天。"],mid:["火别烧太旺，柴得省着点。","嗯。今天风小些，适合下套子。"],high:["你这人，还行。比我想的顶事。","等雪化了，我带你看看这山开春的样子。"]},past:["过去的事，有什么好说的。","这地方以前是护林站。我在这儿住过十几年……后来就不来了。","我儿子叫秦川。八年前，也是这么个冬天，他从这儿出门找人，再没回来。……地窖里还有我当年存的东西，你要用就拿去吧。"],cheer:["用不着你哄我。……不过，谢了。","嗯。我心里有数。"],hungry:"肚子里没食，人就没魂。得多下几个套子。",cold:"柴不够了。这么冻下去，会死人的。",hurt:"这点伤，死不了。"},epilogue:{good:"开春后，老秦在驿站门口种了一棵松树。他说，等它长高了，秦川就能看见回家的路。",ok:"老秦又回到山里巡林。他还是不爱说话，但每年入冬，都会往驿站里囤上柴和粮食，留给下一个迷路的人。",dead:"老秦没能熬过这个冬天。大家把他葬在护林站后面，离他儿子出发的那条路不远。",left:"没人知道老秦去了哪儿。有人说，他是去找儿子了。"},arcFlag:"arc_qin"},lin:{id:"lin",name:"林晚晴",short:"林晚",seal:"林",gender:"f",age:31,job:"急诊科护士",color:"#b5776a",traits:["kind","pessimist"],skills:{str:2,wild:1,craft:1,med:5,talk:3},trust:45,mood:50,starter:!0,bio:"市医院急诊科的护士，连上三个夜班后搭这趟车回镇上看女儿。手机里存满了女儿的照片，电量只剩百分之四。",personality:"温柔、细心、责任感强，总是先照顾别人；心里却很焦虑，容易往坏处想，独处时会偷偷掉眼泪。",voice:'说话轻，句子完整，带着护士的习惯用语（"先别动""我看看""多喝热水"）。提到女儿时语气会软下来。',background:"离婚后独自带女儿朵朵（6岁）。朵朵平时住在山下镇子的外婆家，她每周末回去。",secret:"她答应过朵朵这周末一定回去过生日。她一直在盘算一个人走下山的路线，哪怕她知道这很可能会死。",secretTrust:58,lines:{greet:{low:["我没事……你先去忙吧。","朵朵现在肯定在哭。对不起，我……"],mid:["记得让大家多喝热水，冻伤最怕拖。","今天我把药清点了一遍，省着点还能撑几天。"],high:["有你在，大家心里都踏实一点。","等出去了，我请你吃我们镇上最好吃的羊肉粉。"]},past:["我是护士，就……普通的护士。","我女儿叫朵朵，六岁，在山下外婆家。她这周末过生日。","我说实话吧——我一直在算，从这里走到镇上要多久。四十公里，雪这么厚……我知道很傻。可我答应过她的。"],cheer:["谢谢你。我会撑住的，为了朵朵。","嗯……你说得对，哭也没用。"],hungry:"大家都吃不饱……先紧着孩子和病人吧。",cold:"温度太低了，再这样下去会有人冻伤。",hurt:"我自己就是护士，知道怎么处理，别担心。"},epilogue:{good:"林晚回到了镇上。朵朵的生日晚了半个月，那天她们一起吹了蜡烛，蛋糕上多插了一根，说是给驿站的。",ok:"林晚回到了急诊科。之后每年冬天，她都会报名去山区的医疗队。",dead:"林晚没能等到下山。她最后一句话，是让大家记得给伤口换药。",left:"林晚独自走进了风雪里。没人知道她有没有走到山下。"},arcFlag:"arc_lin"},jie:{id:"jie",name:"周子杰",short:"阿杰",seal:"杰",gender:"m",age:19,job:"美院大一学生",color:"#5b88b0",traits:["optimist","reckless"],skills:{str:3,wild:2,craft:2,med:1,talk:3},trust:55,mood:65,starter:!0,bio:"美院大一新生，背着画板一个人进山写生。成天乐呵呵的，好像什么都不怕——包括那些本该怕的东西。",personality:"开朗、话多、好奇心重，做事冲动不计后果；用玩笑掩饰不安，其实很在意别人怎么看他。",voice:'年轻人口吻，语速快，偶尔用"绝了""离谱""我真的会谢"之类的网络用语，喜欢给别人起外号。',background:'和父亲大吵一架后离家，"进山写生"只是借口。父亲是工地包工头，一心想让他学土木。',secret:"他其实是离家出走的。手机里有几十条父亲的未接来电和消息，他一条都没敢点开。",secretTrust:68,lines:{greet:{low:["哈……没事，我就是有点想家。不是，不想。","我画不出来了，手冻得握不住笔。"],mid:['我给老秦画了张速写，他瞄了一眼说"不像"，然后收起来了，笑死。',"今天去哪儿？我都行，越野一点的最好！"],high:["说真的，你是我见过最靠谱的大人之一。另一个嘛……算了。","等出去了，我要把这三十天画成一本连环画，你是主角。"]},past:["我？美院的，进山写生。就这么简单。","我爸想让我学土木，说画画养不活人。我们吵了一架。","其实我是离家出走的……手机里一堆我爸的消息，我一条都没点开。我怕看到他骂我，更怕看到他没骂我。"],cheer:["嘿嘿，收到！满血复活。","好嘞，我再撑撑。"],hungry:"我能吃下一头牛，真的，现在给我一头牛。",cold:"冷到灵魂出窍了家人们……",hurt:"小伤小伤，就是有点……嘶——疼。"},epilogue:{good:"阿杰回家那天，他爸在车站等了四个小时。后来他真的画完了那本连环画，名字就叫《寒驿》。",ok:"阿杰回到了学校。他再没提过那个冬天，只是画里多了很多雪。",dead:"阿杰永远十九岁了。他的速写本被带下了山，最后一页画的是大家围着火的样子。",left:"阿杰走了，留下一张画：所有人围着火，只有他的位置空着。"},arcFlag:"arc_jie"},ma:{id:"ma",name:"马德福",short:"胖叔",seal:"马",gender:"m",age:47,job:"客车司机",color:"#b08a3c",traits:["bigeater","gourmet"],skills:{str:4,wild:1,craft:4,med:1,talk:2},trust:45,mood:45,starter:!0,bio:"开了二十年山区客运的老司机，年轻时在县城饭馆掌过勺。车是在他手里抛锚的，他嘴上不说，心里一直过不去。",personality:"豪爽、爱热闹、爱吃也会做，嗓门大，喜欢照顾人；心里藏着愧疚，被人指责时会急眼。",voice:'一股烟火气，爱说"放心""包在我身上""娃娃们"，三句话不离吃，口头禅是"吃饱了不想家"。',background:"客运公司的老司机，年轻时当过厨子。老婆在县城开小卖部，儿子在外地打工。",secret:"车坏在半路，是因为他为了省钱推迟了保养，刹车和电路早就有毛病。他一直不敢说。",secretTrust:60,lines:{greet:{low:["都怪我……要是车不坏……算了，不说了。","今天没胃口，你们吃吧。"],mid:["今晚我想法子给大家整锅热汤，放心！","吃饱了不想家，这是我们跑车的老话。"],high:["你这个主事的，我服气。出去了我请你吃我最拿手的红烧肉。","有你在，咱这营地翻不了。"]},past:["跑了二十年车，什么路没跑过。就这回……唉。","年轻时我在县城饭馆掌勺，后来饭馆黄了，才去开的车。手艺还在！","我跟你说句实话，你别告诉别人……车上个月就该保养了。我想着跑完这趟再说，省那几百块……是我害了大家。"],cheer:["哎，好，好！听你的。","行，胖叔不能塌，胖叔塌了谁做饭。"],hungry:"锅里没东西，我这心里也空落落的。",cold:"这风，跟刀子似的。",hurt:"皮糙肉厚，不碍事！"},epilogue:{good:'胖叔后来没再开车。他在县城开了家小饭馆，叫"驿站饭庄"，墙上挂着阿杰画的那张大合影。',ok:"胖叔还在跑山路。现在每趟出车前，他都会把车里里外外检查三遍。",dead:"胖叔走的那天晚上，锅里还温着一碗汤。没人舍得喝。",left:"胖叔说要回客车那儿看看，就再没回来。"},arcFlag:"arc_ma"},su:{id:"su",name:"苏蔓",short:"苏蔓",seal:"苏",gender:"f",age:36,job:"投资公司合伙人",color:"#80609a",traits:["leader","hothead"],skills:{str:1,wild:1,craft:1,med:2,talk:5},trust:25,mood:45,starter:!0,bio:'一身名牌冲锋衣，说话干脆利落，习惯发号施令。她说自己是来山里"散心"的，可没人见过谁这样散心。',personality:"强势、果断、精于计算、脾气急，从不示弱；骨子里极骄傲，也极孤独。",voice:'语速快、逻辑清楚，爱用数字和"效率""成本""止损"这类词，直呼其名，很少客套。',background:"一家投资公司的合伙人。公司刚刚暴雷，她背上了巨额债务，舆论缠身。",secret:'她包里有一部卫星电话，只是电池耗尽了。她谁都没告诉——因为她根本不想被找到，她是来山里"消失"的。',secretTrust:60,lines:{greet:{low:["别跟我说话。我需要安静。","这个营地的管理方式，效率低得令人发指。"],mid:["我算过了，按现在的消耗，你心里最好有个数。","今天的分配还行。只是还行。"],high:["我很少承认别人做得比我好。你算一个。","如果出去以后你想换份工作……算了，当我没说。"]},past:["我的事，与这里无关。","我做投资的。最近……市场不太好。就这样。","公司没了。几个亿的窟窿，全压在我身上。我来这里，本来就没打算回去。……你别这么看我。"],cheer:["不需要你同情我。……但，谢谢。","好吧。我再信你一次。"],hungry:"饿着肚子没法做决策，这是常识。",cold:"这种温度下，失温只需要几个小时。",hurt:"我没那么娇气。"},epilogue:{good:"苏蔓下山后主动配合调查，把能还的都还了。她说，那个冬天之后，她第一次觉得活着本身不需要理由。",ok:"苏蔓回到了城市，重新开始。偶尔深夜，她会翻出那部没用上的卫星电话看一会儿。",dead:"苏蔓没能走出这座山。也许这正是她来时想要的结局，可大家都觉得，她后来已经不这么想了。",left:"苏蔓在一个夜里离开了，带走了她的包。"},arcFlag:"arc_su"},man:{id:"man",name:"小满",short:"小满",seal:"满",gender:"f",age:9,job:"走失的孩子",color:"#c78b8b",traits:["child","timid"],skills:{str:1,wild:1,craft:1,med:1,talk:2},trust:50,mood:35,starter:!1,bio:"在桥边一辆侧翻的轿车里找到的小姑娘，抱着一只脏兮兮的布兔子。她说妈妈去找人帮忙了，让她在车里等。",personality:"胆小、安静、很敏感；熟了以后话多黏人，爱问为什么，会把自己的吃的偷偷留给大人。",voice:'孩子的口吻，短句，常问问题，称呼别人"叔叔""阿姨""爷爷""哥哥"，会提到她的布兔子"豆豆"。',background:"和妈妈开车回外婆家，路上车子滑下了桥边的坡。",secret:"妈妈让她在车里等，她却因为害怕跑了出来。她觉得妈妈找不到她，是因为自己没听话。",secretTrust:62,lines:{greet:{low:["我想妈妈了……","豆豆说它冷。"],mid:["雪什么时候停呀？","我今天帮胖叔剥土豆了，剥了三个！"],high:["你是好人，豆豆也这么说。","等妈妈来了，我要告诉她你保护了我们。"]},past:["……（她把布兔子抱得更紧了。）","我和妈妈去外婆家，车子滑下去了。妈妈说去找人，让我在车里等。","其实……妈妈让我在车里等，我没听话，我跑出来了。是不是因为这样，妈妈才找不到我？"],cheer:["嗯！我不哭了。","那你要拉钩。"],hungry:"我不饿……你们先吃。（肚子咕咕叫了一声。）",cold:"我把豆豆塞衣服里了，这样它就不冷了。",hurt:"不疼……就一点点疼。"},epilogue:{good:"小满在医院见到了妈妈。妈妈的腿打着石膏，抱着她哭了很久。豆豆被洗得干干净净，耳朵是吴伯伯缝的。",ok:"小满被送到了外婆家。妈妈还在医院，但医生说会好起来的。",dead:"小满没能等到妈妈。豆豆被放在了她身边。",left:"小满不见了。雪地上只有一行很小的脚印。"},arcFlag:"arc_man"},gesang:{id:"gesang",name:"格桑卓玛",short:"格桑",seal:"桑",gender:"f",age:27,job:"登山向导",color:"#a5503b",traits:["coldproof","stubborn"],skills:{str:4,wild:4,craft:1,med:2,talk:1},trust:35,mood:30,starter:!1,bio:"在一处雪坳里被发现，红色冲锋衣几乎被雪埋住，左腿受了伤。她是带队进山的向导，可她的队员都不见了。",personality:"坚韧、话少、行动派，对山有敬畏；自责很深，靠拼命干活麻痹自己，最讨厌被可怜。",voice:"简洁、平静。说起山的时候会变得很具体（风向、雪层、坡度），一谈到自己就闭口。",background:"专业登山向导，在这片山区带过上百次队。",secret:"雪崩前，她判断天气还能撑两天，坚持带队继续往前走。三名队员至今下落不明。",secretTrust:50,lines:{greet:{low:["别管我，我能干活。","……我不该带他们上去的。"],mid:["北坡的雪层不稳，这两天别往那边去。","风向变了，晚上会更冷。"],high:["你判断得比我当时准。我是认真的。","等开春，我带你去看真正的雪山，不是这种要人命的。"]},past:["我是向导。就这样。","我带一支队伍进山，遇上了雪崩。我被冲到了坡下面。","是我坚持继续走的。我看了天，以为还有两天的窗口……三个人，到现在都没找到。"],cheer:["……嗯。我知道了。","谢谢。我不会倒下的。"],hungry:"山里饿肚子是常事，我扛得住。",cold:"这种冷我习惯了。别人比我更需要火。",hurt:"腿还行，能走。"},epilogue:{good:"格桑带着搜救队回到了那片雪坳。开春后，三名队员都找到了。她还在做向导，只是再也不赶天气了。",ok:"格桑下山后很久没再进山。后来有人在一条新开的徒步线上看到了她的红色冲锋衣。",dead:"格桑葬在了能看见雪山的地方。这是她自己说过的。",left:"格桑一个人回山里去了。她说，她得去把队员带回来。"},arcFlag:"arc_gesang"},wu:{id:"wu",name:"吴铁",short:"吴铁",seal:"吴",gender:"m",age:52,job:"道班养路工",color:"#6c7884",traits:["diligent","mute"],skills:{str:4,wild:2,craft:5,med:1,talk:1},trust:40,mood:40,starter:!1,bio:"山腰道班里的养路工，一个人守着一屋子工具。他从不说话，只用点头和手势交流。手很巧，什么都能修。",personality:"沉默、踏实、勤快，像一块石头；对孩子格外温柔；害怕被人盯着看。",voice:"他几乎不说话。回答时主要用括号描述动作和表情，最多偶尔挤出一两个字。",background:"在山上道班干了二十多年，负责铲雪和养护这段山路。",secret:"十年前一次铲雪作业，他驾驶的铲雪车出了事故，一个同事因此丧生。从那以后，他就再也没开口说过话。",secretTrust:60,lines:{greet:{low:["（他坐在角落里，盯着自己的手。）","（他摇了摇头，没有看你。）"],mid:["（他点点头，把一把修好的斧子递给你。）",'（他指了指屋顶，又比了个"放心"的手势。）'],high:["（他难得地笑了一下，拍了拍你的肩膀。）","（他从兜里掏出一个小木雕递给你，是一只鹰。）"]},past:["（他沉默地看着火。）","（他在地上用树枝画了一座道班的小房子，又画了一辆铲雪车。）","（他张了张嘴，声音沙哑得像生锈的铁门）……车……是我开的。老李……没出来。"]

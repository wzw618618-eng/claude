<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>寒驿</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="寒驿：大雪封山，八个陌生人困在山间驿站，撑过三十个冬夜。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600&display=swap">
<style>/* 布局：驿站登记簿。顶部是黄历式的「日头」，每位幸存者是一行盖着私印的登记；夜里换成围炉的火光。
   有意只做一套深色：这是一个发生在冬夜里的游戏。 */
:root {
  color-scheme: dark;
  --ink: #0f151c;
  --ink-2: #151d27;
  --ink-3: #1d2833;
  --rule: #2a3846;
  --snow: #e7ebee;
  --frost: #9aabb9;
  --dim: #66788a;
  --paper: #f5ece0;
  --ember: #ee8d4a;
  --ember-ink: #1b0f06;
  --ember-soft: rgba(238, 141, 74, 0.13);
  --good: #8fc29a;
  --warn: #e6b95c;
  --bad: #e8705f;
  --scrim: rgba(4, 7, 11, 0.72);
  --font-display: "Ma Shan Zheng", "STXingkai", "Kaiti SC", "KaiTi", "STKaiti", serif;
  --font-story: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --font-ui: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --r: 10px;
}

* { box-sizing: border-box; }
html, body { background: var(--ink); color: var(--snow); }
body {
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
html.lock, html.lock body { overflow: hidden; }
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 30;
  background: var(--ink);
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { text-wrap: balance; margin: 0; font-weight: 600; }
p { margin: 0; }

.wrap {
  max-width: 640px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ───── 日头 ───── */
.almanac {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--ink);
  border-bottom: 1px solid var(--rule);
}
.almanac .wrap { padding-block: 10px 0; display: grid; gap: 8px; }
.sun { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.sun-day { display: grid; gap: 4px; min-width: 0; }
.sun-day b { font-family: var(--font-display); font-weight: 400; font-size: 34px; line-height: 1; color: var(--paper); letter-spacing: 0.02em; white-space: nowrap; }
.sun-day span, .sun-sky span { color: var(--dim); font-size: 12px; white-space: nowrap; }
.sun-sky { text-align: right; display: grid; gap: 2px; justify-items: end; }
.sun-sky strong { font-size: 18px; color: var(--snow); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.sun-sky .storm { color: var(--bad); }
.res { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.res div { padding: 6px 8px; border-radius: 8px; background: var(--ink-2); min-width: 0; }
.res small { display: block; font-size: 11px; color: var(--dim); letter-spacing: 0.08em; }
.res b { font-size: 19px; font-variant-numeric: tabular-nums; font-weight: 600; }
.res i { font-style: normal; font-size: 11px; margin-left: 4px; font-variant-numeric: tabular-nums; color: var(--frost); }
.res i.neg { color: var(--bad); }
.res i.pos { color: var(--good); }
.res .short b { color: var(--bad); }
.tabs { display: flex; gap: 22px; }
.tabs button { padding: 8px 0 9px; font-size: 14px; color: var(--dim); border-bottom: 2px solid transparent; letter-spacing: 0.1em; }
.tabs button[aria-selected="true"] { color: var(--snow); border-color: var(--ember); }
.tabs .badge { display: inline-block; min-width: 6px; height: 6px; border-radius: 3px; background: var(--ember); margin-left: 4px; vertical-align: 2px; }

main .wrap { padding-block: 14px calc(110px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }

/* ───── 卡片：只给需要单独拎出来的块 ───── */
.note { border: 1px solid var(--rule); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 6px; background: var(--ink-2); }
.note h3 { font-size: 13px; color: var(--frost); letter-spacing: 0.12em; font-weight: 500; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.note h3 button { font-size: 12px; color: var(--ember); letter-spacing: 0; }
.note ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.note li { font-size: 14px; padding-left: 12px; position: relative; color: var(--snow); }
.note li::before { content: ""; position: absolute; left: 0; top: 0.7em; width: 5px; height: 1px; background: var(--dim); }
.note li.good { color: var(--good); }
.note li.bad { color: var(--bad); }
.note li.story { color: var(--paper); }
.note.tip { border-style: dashed; background: transparent; }
.note.tip p { font-size: 13.5px; color: var(--frost); }
.note.tip b { color: var(--snow); font-weight: 600; }

.plan { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.plan > div { min-width: 0; }
.plan small { display: block; font-size: 11px; color: var(--dim); letter-spacing: 0.1em; margin-bottom: 4px; }
.seg { display: flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.seg button { flex: 1; padding: 6px 4px; font-size: 13px; color: var(--frost); }
.seg button[aria-pressed="true"] { background: var(--ink-3); color: var(--snow); }
.forecast { font-size: 13px; color: var(--frost); }
.forecast b { color: var(--snow); font-weight: 600; font-variant-numeric: tabular-nums; }
.forecast .warn { color: var(--warn); }

/* ───── 登记簿 ───── */
.roster { display: grid; }
.roster h2 { font-size: 12px; color: var(--dim); letter-spacing: 0.18em; font-weight: 500; padding-bottom: 4px; }
.person {
  display: grid; grid-template-columns: 46px minmax(0, 1fr) auto;
  grid-template-areas: "seal head right" "seal meters meters";
  column-gap: 12px; row-gap: 8px; align-items: center;
  padding: 12px 0; border-bottom: 1px solid var(--rule);
}
.person > .seal { grid-area: seal; align-self: start; }
.person > .p-head { grid-area: head; }
.person > .meters { grid-area: meters; }
.person > .pill, .person > .p-end { grid-area: right; }
.person.gone { grid-template-areas: "seal head right"; }
.person:last-child { border-bottom: 0; }
.seal {
  width: 46px; height: 46px; border-radius: 7px;
  background: var(--c);
  color: var(--paper);
  font-family: var(--font-display); font-size: 29px; line-height: 1;
  display: grid; place-items: center;
  box-shadow: inset 0 0 0 2px rgba(245, 236, 224, 0.16), inset 0 0 0 4px var(--c), inset 0 0 0 5px rgba(245, 236, 224, 0.28);
}
.seal.big { width: 64px; height: 64px; font-size: 40px; border-radius: 9px; }
.person.gone .seal { filter: grayscale(1) brightness(0.6); }
.p-head { display: flex; align-items: baseline; gap: 4px 8px; flex-wrap: wrap; min-width: 0; }
.p-head b { font-size: 16px; font-weight: 600; }
.p-head span { font-size: 12px; color: var(--dim); }
.person.gone .p-head b { color: var(--dim); text-decoration: line-through; text-decoration-color: var(--dim); }
.chip { font-size: 11px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--rule); color: var(--frost); white-space: nowrap; }
.chip.bad { border-color: color-mix(in srgb, var(--bad) 55%, transparent); color: var(--bad); }
.chip.warn { border-color: color-mix(in srgb, var(--warn) 55%, transparent); color: var(--warn); }
.chip.good { border-color: color-mix(in srgb, var(--good) 55%, transparent); color: var(--good); }
.meters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; min-width: 0; }
.meter { display: grid; gap: 2px; min-width: 0; }
.meter span { font-size: 11px; color: var(--dim); display: flex; justify-content: space-between; gap: 4px; white-space: nowrap; }
.meter span em { font-style: normal; color: var(--frost); font-variant-numeric: tabular-nums; }
.meter i { display: block; height: 4px; border-radius: 2px; background: var(--ink-3); overflow: hidden; }
.meter i::after { content: ""; display: block; height: 100%; width: var(--v); background: var(--fill, var(--frost)); border-radius: 2px; }
.meter.h { --fill: var(--good); }
.meter.s { --fill: #7fa7c9; }
.meter.m { --fill: var(--ember); }
.meter.low { --fill: var(--bad); }
.meter.low span em { color: var(--bad); }

.pill {
  min-width: 92px; max-width: 128px;
  padding: 7px 10px; border-radius: 9px;
  border: 1px solid var(--rule); background: var(--ink-2);
  text-align: left; display: grid; gap: 1px;
}
.pill b { font-size: 15px; font-weight: 600; }
.pill small { font-size: 11px; color: var(--frost); line-height: 1.3; }
button.pill:hover { border-color: var(--dim); }
.pill.static { background: transparent; }
.pill.talk { border-color: color-mix(in srgb, var(--ember) 60%, transparent); }
.pill.talk b { color: var(--ember); }
.pill.done { opacity: 0.55; }
.p-end { font-size: 12px; color: var(--dim); text-align: right; max-width: 110px; }

/* ───── 围炉 ───── */
.hearth {
  border-radius: 14px; padding: 16px 16px 18px;
  background: radial-gradient(120% 90% at 50% 120%, rgba(238, 141, 74, 0.28), transparent 60%), var(--ink-2);
  border: 1px solid var(--rule);
  display: grid; gap: 10px;
  position: relative; overflow: hidden;
}
.hearth::after {
  content: ""; position: absolute; inset: auto 0 -40% 0; height: 70%;
  background: radial-gradient(50% 50% at 50% 50%, rgba(238, 141, 74, 0.22), transparent 70%);
  animation: flicker 3.2s ease-in-out infinite alternate; pointer-events: none;
}
@keyframes flicker { 0% { opacity: 0.55; transform: scale(1); } 50% { opacity: 0.9; transform: scale(1.04); } 100% { opacity: 0.65; transform: scale(0.98); } }
.hearth h2 { font-family: var(--font-display); font-weight: 400; font-size: 26px; color: var(--paper); }
.hearth p { font-family: var(--font-story); font-size: 15px; line-height: 1.85; color: var(--snow); position: relative; z-index: 1; }
.hearth .ai { font-family: var(--font-ui); font-size: 12px; color: var(--frost); }

/* ───── 营建 ───── */
.works { display: grid; gap: 10px; }
.work { border: 1px solid var(--rule); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 6px; }
.work.on { border-color: color-mix(in srgb, var(--ember) 60%, transparent); background: var(--ember-soft); }
.work.done { opacity: 0.6; }
.work.locked { border-style: dashed; }
.work header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.work h3 { font-size: 16px; }
.work header span { font-size: 12px; color: var(--frost); white-space: nowrap; }
.work p { font-size: 13.5px; color: var(--frost); }
.work .bar { height: 5px; border-radius: 3px; background: var(--ink-3); overflow: hidden; }
.work .bar i { display: block; height: 100%; background: var(--ember); width: var(--v); }
.work .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.btn { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--rule); font-size: 14px; background: var(--ink-3); }
.btn.hot { background: var(--ember); border-color: var(--ember); color: var(--ember-ink); font-weight: 600; }
.btn:disabled { opacity: 0.45; }
.btn.ghost { background: transparent; }
.work .why { font-size: 12px; color: var(--dim); }

/* ───── 日志 ───── */
.log { display: grid; gap: 14px; }
.log section { display: grid; gap: 4px; }
.log h3 { font-family: var(--font-display); font-weight: 400; font-size: 22px; color: var(--paper); }
.log p { font-size: 14px; color: var(--frost); padding-left: 12px; border-left: 1px solid var(--rule); }
.log p.story { color: var(--snow); font-family: var(--font-story); }
.log p.good { color: var(--good); }
.log p.bad { color: var(--bad); }

/* ───── 行动条 ───── */
.act {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  background: linear-gradient(to top, var(--ink) 62%, rgba(15, 21, 28, 0));
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.act .wrap { padding-block: 18px 12px; display: flex; gap: 10px; align-items: center; }
.act .hint { flex: 1; min-width: 0; font-size: 12.5px; color: var(--frost); line-height: 1.4; }
.go {
  flex: none; padding: 13px 22px; border-radius: 12px;
  background: var(--ember); color: var(--ember-ink);
  font-size: 16px; font-weight: 700; letter-spacing: 0.12em;
  box-shadow: 0 6px 24px rgba(238, 141, 74, 0.25);
}
.go:disabled { background: var(--ink-3); color: var(--dim); box-shadow: none; }

/* ───── 浮层 ───── */
.scrim { position: fixed; inset: 0; z-index: 40; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; animation: fade 0.18s ease-out; }
@keyframes fade { from { opacity: 0; } }
.sheet {
  width: 100%; max-width: 640px; max-height: 88%;
  overflow-y: auto; overscroll-behavior: contain;
  background: var(--ink-2); border: 1px solid var(--rule); border-bottom: 0;
  border-radius: 16px 16px 0 0;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: grid; gap: 14px; align-content: start;
  animation: rise 0.22s ease-out;
}
@keyframes rise { from { transform: translateY(24px); opacity: 0.4; } }
.sheet-head { display: flex; align-items: center; gap: 12px; }
.sheet-head > div { flex: 1; min-width: 0; }
.sheet-head h2 { font-size: 19px; }
.sheet-head p { font-size: 12.5px; color: var(--frost); }
.x { width: 34px; height: 34px; border-radius: 17px; border: 1px solid var(--rule); color: var(--frost); font-size: 18px; line-height: 1; flex: none; }

.tasks { display: grid; gap: 6px; }
.task { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; align-items: center; text-align: left; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--rule); }
.task b { font-size: 16px; font-weight: 600; }
.task div { min-width: 0; display: grid; gap: 1px; }
.task span { font-size: 13px; color: var(--snow); }
.task small { font-size: 11.5px; color: var(--dim); }
.task small.risk { color: var(--warn); }
.task[aria-pressed="true"] { border-color: var(--ember); background: var(--ember-soft); }
.task:disabled { opacity: 0.4; }

.bio { font-family: var(--font-story); font-size: 15px; line-height: 1.85; color: var(--snow); }
.secret { border-left: 2px solid var(--ember); padding-left: 12px; font-family: var(--font-story); font-size: 14px; color: var(--paper); line-height: 1.8; }
.kv { display: grid; gap: 8px; }
.kv h3 { font-size: 12px; color: var(--dim); letter-spacing: 0.16em; font-weight: 500; }
.traits { display: grid; gap: 6px; }
.traits div { font-size: 13.5px; color: var(--frost); }
.traits b { color: var(--snow); font-weight: 600; margin-right: 6px; }
.skills { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; text-align: center; }
.skills div { background: var(--ink-3); border-radius: 8px; padding: 6px 2px; }
.skills small { display: block; font-size: 11px; color: var(--dim); }
.skills b { font-size: 18px; font-variant-numeric: tabular-nums; }
.rels { display: grid; gap: 6px; }
.rel { display: grid; grid-template-columns: 52px minmax(0, 1fr) 54px; gap: 10px; align-items: center; font-size: 13px; }
.rel span:last-child { text-align: right; color: var(--frost); }
.rel .track { height: 4px; background: var(--ink-3); border-radius: 2px; position: relative; }
.rel .track::before { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--dim); }
.rel .track i { position: absolute; top: 0; bottom: 0; border-radius: 2px; }

/* 对话 */
.chat { display: grid; gap: 10px; }
.bubble { max-width: 86%; padding: 9px 12px; border-radius: 12px; font-size: 15px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
.bubble.them { justify-self: start; background: var(--ink-3); font-family: var(--font-story); border-top-left-radius: 4px; }
.bubble.me { justify-self: end; background: var(--ember-soft); border: 1px solid color-mix(in srgb, var(--ember) 40%, transparent); border-top-right-radius: 4px; }
.bubble.wait { color: var(--frost); font-family: var(--font-ui); font-size: 13px; }
.topics { display: flex; flex-wrap: wrap; gap: 6px; }
.topics button { padding: 7px 12px; border-radius: 16px; border: 1px solid var(--rule); font-size: 13.5px; }
.topics button:disabled { opacity: 0.4; }
.say { display: flex; gap: 8px; }
.say input {
  flex: 1; min-width: 0; padding: 10px 12px; border-radius: 10px;
  border: 1px solid var(--rule); background: var(--ink); color: var(--snow);
  font: inherit; font-size: 16px;
}
.say input::placeholder { color: var(--dim); }
.mini { font-size: 12px; color: var(--dim); }
.mini.err { color: var(--warn); }

/* 事件 */
.event { gap: 16px; }
.event h2 { font-family: var(--font-display); font-weight: 400; font-size: 30px; color: var(--paper); line-height: 1.2; }
.event .who { display: flex; gap: 8px; }
.event .who .seal { width: 36px; height: 36px; font-size: 22px; border-radius: 6px; }
.event .story { font-family: var(--font-story); font-size: 16px; line-height: 1.9; white-space: pre-line; color: var(--snow); }
.choices { display: grid; gap: 8px; }
.choice { text-align: left; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--rule); background: var(--ink-3); display: grid; gap: 2px; }
.choice b { font-size: 15px; font-weight: 600; }
.choice small { font-size: 12px; color: var(--frost); }
.choice:hover:not(:disabled) { border-color: var(--ember); }
.choice:disabled { opacity: 0.42; }
.event .step { font-size: 12px; color: var(--dim); letter-spacing: 0.1em; }

/* ───── 标题与结局 ───── */
.title { min-height: 100vh; min-height: 100dvh; position: relative; display: grid; align-content: center; overflow: hidden; }
.title canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.title .wrap { position: relative; padding-block: 48px; display: grid; gap: 22px; }
.title h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(84px, 26vw, 140px); line-height: 0.95; color: var(--paper); letter-spacing: 0.04em; }
.title h1 span { display: block; font-family: var(--font-ui); font-size: 14px; letter-spacing: 0.5em; color: var(--ember); margin-top: 14px; font-weight: 500; }
.title .story { font-family: var(--font-story); font-size: 16px; line-height: 1.95; color: var(--snow); max-width: 34em; }
.title .row { display: flex; gap: 10px; flex-wrap: wrap; }
.title .go { padding-inline: 28px; }
.title .mini { max-width: 34em; line-height: 1.6; }
.cast { display: flex; gap: 6px; flex-wrap: wrap; }
.cast .seal { width: 34px; height: 34px; font-size: 20px; border-radius: 6px; }
.cast .seal.unknown { background: var(--ink-3); color: var(--dim); box-shadow: inset 0 0 0 1px var(--rule); }

.ending .wrap { padding-block: 40px calc(40px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 22px; }
.ending h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(48px, 13vw, 72px); color: var(--paper); line-height: 1.05; }
.ending .story { font-family: var(--font-story); font-size: 16px; line-height: 1.95; }
.fates { display: grid; gap: 16px; margin: 0; padding: 0; list-style: none; }
.fates li { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 12px; }
.fates li > div { display: grid; gap: 6px; min-width: 0; }
.fates p { font-family: var(--font-story); font-size: 14.5px; line-height: 1.8; color: var(--frost); }
.fates .gone .seal { filter: grayscale(1) brightness(0.6); }
.tally { display: flex; gap: 18px; flex-wrap: wrap; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding-block: 12px; }
.tally div small { display: block; font-size: 11px; color: var(--dim); letter-spacing: 0.1em; }
.tally div b { font-size: 22px; font-variant-numeric: tabular-nums; }

.still { animation: none !important; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
@media (max-width: 380px) {
  .person { grid-template-columns: 40px minmax(0, 1fr) auto; column-gap: 10px; }
  .seal { width: 40px; height: 40px; font-size: 25px; }

<script>"use strict";(()=>{var K={qin:{id:"qin",name:"秦守山",short:"老秦",seal:"秦",gender:"m",age:58,job:"退休护林员",color:"#5f7d5c",traits:["coldproof","loner"],skills:{str:3,wild:5,craft:2,med:1,talk:1},trust:30,mood:50,starter:!0,bio:"在这片山里巡了三十年林。驿站的钥匙一直挂在他脖子上，可他好像并不愿意回到这里。",personality:"沉默寡言，脾气硬，嘴上不饶人，看不惯浪费和城里人的娇气；但会在夜里悄悄起来给别人添柴。",voice:'话很短，常说"嗯""别废话""山里不讲这个"。语气干、硬，带点北方山里人的土气，从不用网络用语。',background:"退休前是这一带的护林员，这座驿站以前就是护林站，他在这里住过十几年。熟悉每一条沟、每一片林子。",secret:"八年前的冬天，他的儿子秦川从这个护林站出发去搜救迷路的驴友，再也没有回来。他一直觉得是自己没拦住儿子。驿站地窖里还存着他当年囤下的物资。",secretTrust:55,lines:{greet:{low:["……别问了，干活去。","这天，熬一天算一天。"],mid:["火别烧太旺，柴得省着点。","嗯。今天风小些，适合下套子。"],high:["你这人，还行。比我想的顶事。","等雪化了，我带你看看这山开春的样子。"]},past:["过去的事，有什么好说的。","这地方以前是护林站。我在这儿住过十几年……后来就不来了。","我儿子叫秦川。八年前，也是这么个冬天，他从这儿出门找人，再没回来。……地窖里还有我当年存的东西，你要用就拿去吧。"],cheer:["用不着你哄我。……不过，谢了。","嗯。我心里有数。"],hungry:"肚子里没食，人就没魂。得多下几个套子。",cold:"柴不够了。这么冻下去，会死人的。",hurt:"这点伤，死不了。"},epilogue:{good:"开春后，老秦在驿站门口种了一棵松树。他说，等它长高了，秦川就能看见回家的路。",ok:"老秦又回到山里巡林。他还是不爱说话，但每年入冬，都会往驿站里囤上柴和粮食，留给下一个迷路的人。",dead:"老秦没能熬过这个冬天。大家把他葬在护林站后面，离他儿子出发的那条路不远。",left:"没人知道老秦去了哪儿。有人说，他是去找儿子了。"},arcFlag:"arc_qin"},lin:{id:"lin",name:"林晚晴",short:"林晚",seal:"林",gender:"f",age:31,job:"急诊科护士",color:"#b5776a",traits:["kind","pessimist"],skills:{str:2,wild:1,craft:1,med:5,talk:3},trust:45,mood:50,starter:!0,bio:"市医院急诊科的护士，连上三个夜班后搭这趟车回镇上看女儿。手机里存满了女儿的照片，电量只剩百分之四。",personality:"温柔、细心、责任感强，总是先照顾别人；心里却很焦虑，容易往坏处想，独处时会偷偷掉眼泪。",voice:'说话轻，句子完整，带着护士的习惯用语（"先别动""我看看""多喝热水"）。提到女儿时语气会软下来。',background:"离婚后独自带女儿朵朵（6岁）。朵朵平时住在山下镇子的外婆家，她每周末回去。",secret:"她答应过朵朵这周末一定回去过生日。她一直在盘算一个人走下山的路线，哪怕她知道这很可能会死。",secretTrust:40,lines:{greet:{low:["我没事……你先去忙吧。","朵朵现在肯定在哭。对不起，我……"],mid:["记得让大家多喝热水，冻伤最怕拖。","今天我把药清点了一遍，省着点还能撑几天。"],high:["有你在，大家心里都踏实一点。","等出去了，我请你吃我们镇上最好吃的羊肉粉。"]},past:["我是护士，就……普通的护士。","我女儿叫朵朵，六岁，在山下外婆家。她这周末过生日。","我说实话吧——我一直在算，从这里走到镇上要多久。四十公里，雪这么厚……我知道很傻。可我答应过她的。"],cheer:["谢谢你。我会撑住的，为了朵朵。","嗯……你说得对，哭也没用。"],hungry:"大家都吃不饱……先紧着孩子和病人吧。",cold:"温度太低了，再这样下去会有人冻伤。",hurt:"我自己就是护士，知道怎么处理，别担心。"},epilogue:{good:"林晚回到了镇上。朵朵的生日晚了半个月，那天她们一起吹了蜡烛，蛋糕上多插了一根，说是给驿站的。",ok:"林晚回到了急诊科。之后每年冬天，她都会报名去山区的医疗队。",dead:"林晚没能等到下山。她最后一句话，是让大家记得给伤口换药。",left:"林晚独自走进了风雪里。没人知道她有没有走到山下。"},arcFlag:"arc_lin"},jie:{id:"jie",name:"周子杰",short:"阿杰",seal:"杰",gender:"m",age:19,job:"美院大一学生",color:"#5b88b0",traits:["optimist","reckless"],skills:{str:3,wild:2,craft:2,med:1,talk:3},trust:55,mood:65,starter:!0,bio:"美院大一新生，背着画板一个人进山写生。成天乐呵呵的，好像什么都不怕——包括那些本该怕的东西。",personality:"开朗、话多、好奇心重，做事冲动不计后果；用玩笑掩饰不安，其实很在意别人怎么看他。",voice:'年轻人口吻，语速快，偶尔用"绝了""离谱""我真的会谢"之类的网络用语，喜欢给别人起外号。',background:'和父亲大吵一架后离家，"进山写生"只是借口。父亲是工地包工头，一心想让他学土木。',secret:"他其实是离家出走的。手机里有几十条父亲的未接来电和消息，他一条都没敢点开。",secretTrust:45,lines:{greet:{low:["哈……没事，我就是有点想家。不是，不想。","我画不出来了，手冻得握不住笔。"],mid:['我给老秦画了张速写，他瞄了一眼说"不像"，然后收起来了，笑死。',"今天去哪儿？我都行，越野一点的最好！"],high:["说真的，你是我见过最靠谱的大人之一。另一个嘛……算了。","等出去了，我要把这三十天画成一本连环画，你是主角。"]},past:["我？美院的，进山写生。就这么简单。","我爸想让我学土木，说画画养不活人。我们吵了一架。","其实我是离家出走的……手机里一堆我爸的消息，我一条都没点开。我怕看到他骂我，更怕看到他没骂我。"],cheer:["嘿嘿，收到！满血复活。","好嘞，我再撑撑。"],hungry:"我能吃下一头牛，真的，现在给我一头牛。",cold:"冷到灵魂出窍了家人们……",hurt:"小伤小伤，就是有点……嘶——疼。"},epilogue:{good:"阿杰回家那天，他爸在车站等了四个小时。后来他真的画完了那本连环画，名字就叫《寒驿》。",ok:"阿杰回到了学校。他再没提过那个冬天，只是画里多了很多雪。",dead:"阿杰永远十九岁了。他的速写本被带下了山，最后一页画的是大家围着火的样子。",left:"阿杰走了，留下一张画：所有人围着火，只有他的位置空着。"},arcFlag:"arc_jie"},ma:{id:"ma",name:"马德福",short:"胖叔",seal:"马",gender:"m",age:47,job:"客车司机",color:"#b08a3c",traits:["bigeater","gourmet"],skills:{str:4,wild:1,craft:4,med:1,talk:2},trust:45,mood:45,starter:!0,bio:"开了二十年山区客运的老司机，年轻时在县城饭馆掌过勺。车是在他手里抛锚的，他嘴上不说，心里一直过不去。",personality:"豪爽、爱热闹、爱吃也会做，嗓门大，喜欢照顾人；心里藏着愧疚，被人指责时会急眼。",voice:'一股烟火气，爱说"放心""包在我身上""娃娃们"，三句话不离吃，口头禅是"吃饱了不想家"。',background:"客运公司的老司机，年轻时当过厨子。老婆在县城开小卖部，儿子在外地打工。",secret:"车坏在半路，是因为他为了省钱推迟了保养，刹车和电路早就有毛病。他一直不敢说。",secretTrust:50,lines:{greet:{low:["都怪我……要是车不坏……算了，不说了。","今天没胃口，你们吃吧。"],mid:["今晚我想法子给大家整锅热汤，放心！","吃饱了不想家，这是我们跑车的老话。"],high:["你这个主事的，我服气。出去了我请你吃我最拿手的红烧肉。","有你在，咱这营地翻不了。"]},past:["跑了二十年车，什么路没跑过。就这回……唉。","年轻时我在县城饭馆掌勺，后来饭馆黄了，才去开的车。手艺还在！","我跟你说句实话，你别告诉别人……车上个月就该保养了。我想着跑完这趟再说，省那几百块……是我害了大家。"],cheer:["哎，好，好！听你的。","行，胖叔不能塌，胖叔塌了谁做饭。"],hungry:"锅里没东西，我这心里也空落落的。",cold:"这风，跟刀子似的。",hurt:"皮糙肉厚，不碍事！"},epilogue:{good:'胖叔后来没再开车。他在县城开了家小饭馆，叫"驿站饭庄"，墙上挂着阿杰画的那张大合影。',ok:"胖叔还在跑山路。现在每趟出车前，他都会把车里里外外检查三遍。",dead:"胖叔走的那天晚上，锅里还温着一碗汤。没人舍得喝。",left:"胖叔说要回客车那儿看看，就再没回来。"},arcFlag:"arc_ma"},su:{id:"su",name:"苏蔓",short:"苏蔓",seal:"苏",gender:"f",age:36,job:"投资公司合伙人",color:"#80609a",traits:["leader","hothead"],skills:{str:1,wild:1,craft:1,med:2,talk:5},trust:25,mood:45,starter:!0,bio:'一身名牌冲锋衣，说话干脆利落，习惯发号施令。她说自己是来山里"散心"的，可没人见过谁这样散心。',personality:"强势、果断、精于计算、脾气急，从不示弱；骨子里极骄傲，也极孤独。",voice:'语速快、逻辑清楚，爱用数字和"效率""成本""止损"这类词，直呼其名，很少客套。',background:"一家投资公司的合伙人。公司刚刚暴雷，她背上了巨额债务，舆论缠身。",secret:'她包里有一部卫星电话，只是电池耗尽了。她谁都没告诉——因为她根本不想被找到，她是来山里"消失"的。',secretTrust:60,lines:{greet:{low:["别跟我说话。我需要安静。","这个营地的管理方式，效率低得令人发指。"],mid:["我算过了，按现在的消耗，你心里最好有个数。","今天的分配还行。只是还行。"],high:["我很少承认别人做得比我好。你算一个。","如果出去以后你想换份工作……算了，当我没说。"]},past:["我的事，与这里无关。","我做投资的。最近……市场不太好。就这样。","公司没了。几个亿的窟窿，全压在我身上。我来这里，本来就没打算回去。……你别这么看我。"],cheer:["不需要你同情我。……但，谢谢。","好吧。我再信你一次。"],hungry:"饿着肚子没法做决策，这是常识。",cold:"这种温度下，失温只需要几个小时。",hurt:"我没那么娇气。"},epilogue:{good:"苏蔓下山后主动配合调查，把能还的都还了。她说，那个冬天之后，她第一次觉得活着本身不需要理由。",ok:"苏蔓回到了城市，重新开始。偶尔深夜，她会翻出那部没用上的卫星电话看一会儿。",dead:"苏蔓没能走出这座山。也许这正是她来时想要的结局，可大家都觉得，她后来已经不这么想了。",left:"苏蔓在一个夜里离开了，带走了她的包。"},arcFlag:"arc_su"},man:{id:"man",name:"小满",short:"小满",seal:"满",gender:"f",age:9,job:"走失的孩子",color:"#c78b8b",traits:["child","timid"],skills:{str:1,wild:1,craft:1,med:1,talk:2},trust:50,mood:35,starter:!1,bio:"在桥边一辆侧翻的轿车里找到的小姑娘，抱着一只脏兮兮的布兔子。她说妈妈去找人帮忙了，让她在车里等。",personality:"胆小、安静、很敏感；熟了以后话多黏人，爱问为什么，会把自己的吃的偷偷留给大人。",voice:'孩子的口吻，短句，常问问题，称呼别人"叔叔""阿姨""爷爷""哥哥"，会提到她的布兔子"豆豆"。',background:"和妈妈开车回外婆家，路上车子滑下了桥边的坡。",secret:"妈妈让她在车里等，她却因为害怕跑了出来。她觉得妈妈找不到她，是因为自己没听话。",secretTrust:50,lines:{greet:{low:["我想妈妈了……","豆豆说它冷。"],mid:["雪什么时候停呀？","我今天帮胖叔剥土豆了，剥了三个！"],high:["你是好人，豆豆也这么说。","等妈妈来了，我要告诉她你保护了我们。"]},past:["……（她把布兔子抱得更紧了。）","我和妈妈去外婆家，车子滑下去了。妈妈说去找人，让我在车里等。","其实……妈妈让我在车里等，我没听话，我跑出来了。是不是因为这样，妈妈才找不到我？"],cheer:["嗯！我不哭了。","那你要拉钩。"],hungry:"我不饿……你们先吃。（肚子咕咕叫了一声。）",cold:"我把豆豆塞衣服里了，这样它就不冷了。",hurt:"不疼……就一点点疼。"},epilogue:{good:"小满在医院见到了妈妈。妈妈的腿打着石膏，抱着她哭了很久。豆豆被洗得干干净净，耳朵是吴伯伯缝的。",ok:"小满被送到了外婆家。妈妈还在医院，但医生说会好起来的。",dead:"小满没能等到妈妈。豆豆被放在了她身边。",left:"小满不见了。雪地上只有一行很小的脚印。"},arcFlag:"arc_man"},gesang:{id:"gesang",name:"格桑卓玛",short:"格桑",seal:"桑",gender:"f",age:27,job:"登山向导",color:"#a5503b",traits:["coldproof","stubborn"],skills:{str:4,wild:4,craft:1,med:2,talk:1},trust:35,mood:30,starter:!1,bio:"在一处雪坳里被发现，红色冲锋衣几乎被雪埋住，左腿受了伤。她是带队进山的向导，可她的队员都不见了。",personality:"坚韧、话少、行动派，对山有敬畏；自责很深，靠拼命干活麻痹自己，最讨厌被可怜。",voice:"简洁、平静。说起山的时候会变得很具体（风向、雪层、坡度），一谈到自己就闭口。",background:"专业登山向导，在这片山区带过上百次队。",secret:"雪崩前，她判断天气还能撑两天，坚持带队继续往前走。三名队员至今下落不明。",secretTrust:50,lines:{greet:{low:["别管我，我能干活。","……我不该带他们上去的。"],mid:["北坡的雪层不稳，这两天别往那边去。","风向变了，晚上会更冷。"],high:["你判断得比我当时准。我是认真的。","等开春，我带你去看真正的雪山，不是这种要人命的。"]},past:["我是向导。就这样。","我带一支队伍进山，遇上了雪崩。我被冲到了坡下面。","是我坚持继续走的。我看了天，以为还有两天的窗口……三个人，到现在都没找到。"],cheer:["……嗯。我知道了。","谢谢。我不会倒下的。"],hungry:"山里饿肚子是常事，我扛得住。",cold:"这种冷我习惯了。别人比我更需要火。",hurt:"腿还行，能走。"},epilogue:{good:"格桑带着搜救队回到了那片雪坳。开春后，三名队员都找到了。她还在做向导，只是再也不赶天气了。",ok:"格桑下山后很久没再进山。后来有人在一条新开的徒步线上看到了她的红色冲锋衣。",dead:"格桑葬在了能看见雪山的地方。这是她自己说过的。",left:"格桑一个人回山里去了。她说，她得去把队员带回来。"},arcFlag:"arc_gesang"},wu:{id:"wu",name:"吴铁",short:"吴铁",seal:"吴",gender:"m",age:52,job:"道班养路工",color:"#6c7884",traits:["diligent","mute"],skills:{str:4,wild:2,craft:5,med:1,talk:1},trust:40,mood:40,starter:!1,bio:"山腰道班里的养路工，一个人守着一屋子工具。他从不说话，只用点头和手势交流。手很巧，什么都能修。",personality:"沉默、踏实、勤快，像一块石头；对孩子格外温柔；害怕被人盯着看。",voice:"他几乎不说话。回答时主要用括号描述动作和表情，最多偶尔挤出一两个字。",background:"在山上道班干了二十多年，负责铲雪和养护这段山路。",secret:"十年前一次铲雪作业，他驾驶的铲雪车出了事故，一个同事因此丧生。从那以后，他就再也没开口说过话。",secretTrust:60,lines:{greet:{low:["（他坐在角落里，盯着自己的手。）","（他摇了摇头，没有看你。）"],mid:["（他点点头，把一把修好的斧子递给你。）",'（他指了指屋顶，又比了个"放心"的手势。）'],high:["（他难得地笑了一下，拍了拍你的肩膀。）","（他从兜里掏出一个小木雕递给你，是一只鹰。）"]},past:["（他沉默地看着火。）","（他在地上用树枝画了一座道班的小房子，又画了一辆铲雪车。）","（他张了张嘴，声音沙哑得像生锈的铁门）……车……是我开的。老李……没出来。"],cheer:["（他点点头。）","（他握了握拳，又慢慢松开。）"],hungry:"（他把自己那份往别人那边推了推。）",cold:"（他默默起身，往火里添了一根柴。）",hurt:"（他摆摆手，示意不要紧。）"},epilogue:{good:'吴铁后来又开始说话了，虽然很慢。道班来了新人，他留下来当了师傅，教的第一课是"别怕，慢慢来"。',ok:"吴铁回到了道班。今年冬天，那段山路是全县第一条铲通的。",dead:"吴铁走的时候很安静，就像他活着的时候一样。他手里握着一个没刻完的木雕。",left:"吴铁回道班去了。门口留着一排修好的工具。"},arcFlag:"arc_wu"}},pe=["qin","lin","jie","ma","su","man","gesang","wu"],tt={"jie|qin":5,"ma|qin":15,"qin|su":-10,"jie|lin":10,"lin|ma":10,"lin|su":0,"ma|su":-25,"jie|su":-5,"jie|ma":15},nt={"jie|qin":{warm:["阿杰缠着老秦讲山里的事。老秦嫌他吵，却一直讲到了半夜。","老秦教阿杰辨认雪地上的狐狸脚印，阿杰把它们一个个画进了本子里。"],cold:["阿杰模仿老秦说话的样子，被老秦瞪了一眼，屋里一下安静了。"]},"jie|ma":{warm:["胖叔把锅底最后一点锅巴留给了阿杰，两个人笑得前仰后合。"],cold:["阿杰嫌胖叔打呼噜，胖叔嘟囔着翻了个身。"]},"ma|su":{warm:["苏蔓帮胖叔算了算剩下的口粮，两个人头一回没吵起来。"],cold:["苏蔓又提起客车抛锚的事，胖叔的脸涨得通红，一句话也没回。"]},"lin|man":{warm:["小满靠在林晚怀里睡着了。林晚一动也不敢动，就那样坐了一夜。"],cold:["小满一直哭，林晚哄了很久，自己也红了眼眶。"]},"man|wu":{warm:["吴铁给小满的布兔子缝好了掉下来的耳朵。小满抱着豆豆，绕着他转了三圈。"],cold:["小满有点怕吴铁，躲在别人身后偷偷看他。"]},"gesang|qin":{warm:["老秦和格桑在地上画起了山势图，为哪条沟能走争了半宿，最后谁也没说服谁，却都笑了。"],cold:["老秦说外地向导不懂这片山，格桑冷冷地看了他一眼。"]},"lin|su":{warm:["林晚给苏蔓冻伤的手指上药，苏蔓别过脸，低声说了句谢谢。"],cold:["苏蔓嫌林晚太婆婆妈妈，林晚没吭声，转身去照顾别人了。"]},"jie|man":{warm:["阿杰给小满画了一张豆豆的肖像。小满把它贴身收着。"],cold:["阿杰讲了个鬼故事，把小满吓哭了，被大家一顿数落。"]},"ma|man":{warm:["胖叔用面糊给小满烙了个兔子形状的饼。"],cold:["胖叔嗓门太大，吓得小满一哆嗦。"]},"jie|wu":{warm:["阿杰对着吴铁比划了半天，两个人竟然用手势聊了一晚上。"],cold:["阿杰一直追问吴铁为什么不说话，吴铁起身走开了。"]},"gesang|jie":{warm:["格桑教阿杰怎么打绳结，阿杰学会了三种，忘了两种。"],cold:["阿杰说想去北坡看看，被格桑厉声喝止。"]}};var D=(e,t,n)=>Math.max(t,Math.min(n,e)),_=e=>K[e],j=e=>K[e].short,G=e=>K[e].gender==="f"?"她":"他";function C(e,t){return e.chars.find(n=>n.id===t)}function v(e){return e.chars.filter(t=>t.status==="active")}function T(e,t){var n;return((n=C(e,t))==null?void 0:n.status)==="active"}function b(e,t){return _(typeof e=="string"?e:e.id).traits.includes(t)}var J=(e,t)=>Math.floor(e.skills[t]+1e-6),$e=(e,t)=>e<t?`${e}|${t}`:`${t}|${e}`,M=(e,t,n)=>{var r;return(r=e.rel[$e(t,n)])!=null?r:0};function x(e,t,n,r){var o;if(t===n)return;let a=1;if(r>0)for(let i of[t,n])b(i,"kind")&&(a*=1.25),b(i,"loner")&&(a*=.6);else for(let i of[t,n])b(i,"hothead")&&(a*=1.3);let s=$e(t,n);e.rel[s]=D(Math.round(((o=e.rel[s])!=null?o:0)+r*a),-100,100)}function g(e,t){e.mood=D(e.mood+t,0,10

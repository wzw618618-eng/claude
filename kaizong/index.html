<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>开宗立派</title>
<meta name="description" content="开宗立派：在荒山开宗，收徒、用人、定方略、御强敌。弟子由 AI 按性格自己过日子。">
<meta name="theme-color" content="#141a2e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>:root {
  --bg: #0f1424;
  --bg2: #161d33;
  --panel: rgba(20, 26, 46, 0.86);
  --panel2: rgba(30, 38, 64, 0.9);
  --line: rgba(232, 195, 114, 0.22);
  --line2: rgba(255, 255, 255, 0.08);
  --text: #eef0f6;
  --muted: #a3abc2;
  --gold: #e8c372;
  --gold2: #c79a45;
  --jade: #5fd3b3;
  --red: #ef6f6c;
  --blue: #7aa7ff;
  --violet: #b29cff;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  --serif: 'Noto Serif SC', 'Songti SC', serif;
  --sans: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: radial-gradient(1200px 700px at 70% -10%, #2a3a6a 0%, transparent 60%), radial-gradient(900px 600px at -10% 110%, #23404a 0%, transparent 55%), var(--bg);
  color: var(--text); font: 15px/1.6 var(--sans); -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, h4 { font-family: var(--serif); margin: 0; }
.muted { color: var(--muted); }
.fine { color: var(--muted); font-size: 12.5px; margin: 4px 0; }
.good-t { color: var(--jade); }
.bad-t { color: var(--red); }
small { font-size: 12px; }

/* 按钮 */
.btn {
  border: 1px solid var(--line); background: var(--panel2); padding: 7px 14px; border-radius: 10px; line-height: 1.3;
  display: inline-flex; flex-direction: column; align-items: center; gap: 1px; transition: transform 0.08s, background 0.15s, border-color 0.15s;
}
.btn small { color: var(--muted); font-size: 11px; }
.btn:hover:not(:disabled) { border-color: var(--gold); background: #2a3354; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary { background: linear-gradient(180deg, #f0cf86, #c99b48); color: #2a1d08; border-color: #f3d998; font-weight: 700; }
.btn.primary small { color: #5a4316; }
.btn.primary:hover:not(:disabled) { background: linear-gradient(180deg, #f7dc9c, #d6a955); }
.btn.ghost { background: transparent; }
.btn.danger { border-color: rgba(239, 111, 108, 0.5); color: #ffb3b1; }
.btn.big { padding: 12px 22px; font-size: 17px; border-radius: 12px; }
.btn.sm { padding: 5px 10px; font-size: 13.5px; }
.btn.xs { padding: 2px 8px; font-size: 12.5px; border-radius: 7px; }
.link { background: none; border: 0; padding: 0; color: var(--gold); text-decoration: underline dotted; text-underline-offset: 3px; }
.chip {
  display: inline-flex; align-items: baseline; gap: 6px; padding: 3px 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--line2); font-size: 13.5px; margin: 2px 4px 2px 0;
}
.chip small { color: var(--muted); }
.chip.good { border-color: rgba(95, 211, 179, 0.5); }
.chip.bad { border-color: rgba(239, 111, 108, 0.6); }
.chip.dead { opacity: 0.5; text-decoration: line-through; }
.tag { font-size: 11.5px; padding: 1px 7px; border-radius: 6px; background: rgba(255, 255, 255, 0.08); margin-left: 4px; white-space: nowrap; }
.tag.bad { background: rgba(239, 111, 108, 0.18); color: #ffb3b1; }
.tag.gold { background: rgba(232, 195, 114, 0.18); color: var(--gold); }
input, select { background: #0e1324; border: 1px solid var(--line2); border-radius: 8px; padding: 5px 8px; max-width: 100%; }
input:focus, select:focus { outline: 2px solid rgba(232, 195, 114, 0.5); outline-offset: 1px; }

.bar { display: inline-block; width: 52px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.1); vertical-align: middle; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; background: var(--blue); }
.bar.good i { background: var(--jade); }
.bar.bad i { background: var(--red); }
.bar.gold i { background: var(--gold); }

/* 标题 */
.title-screen { min-height: 100vh; display: grid; place-items: center; position: relative; overflow: hidden; padding: 24px 16px; }
.title-art {
  position: absolute; inset: 0; opacity: 0.9;
  background:
    radial-gradient(circle at 78% 22%, rgba(255, 246, 220, 0.9) 0 50px, transparent 52px),
    linear-gradient(180deg, transparent 55%, rgba(15, 20, 36, 0.95)),
    conic-gradient(from 200deg at 50% 120%, #1f3550, #355b70, #1f3550),
    linear-gradient(180deg, #2b3f6b, #8fb6d9 60%, #f3d3d9);
  -webkit-mask: linear-gradient(#000 0 100%);
}
.title-art::after {
  content: ''; position: absolute; inset: auto 0 0 0; height: 62%;
  background: linear-gradient(180deg, #3d6a5c, #18302d);
  clip-path: polygon(0 60%, 14% 35%, 26% 50%, 40% 12%, 50% 0, 60% 14%, 72% 42%, 86% 30%, 100% 55%, 100% 100%, 0 100%);
}
.title-box { position: relative; text-align: center; background: rgba(15, 20, 36, 0.62); border: 1px solid var(--line); padding: 36px 40px; border-radius: 20px; box-shadow: var(--shadow); backdrop-filter: blur(6px); max-width: 520px; width: 100%; }
.logo { font-family: 'Ma Shan Zheng', var(--serif); font-size: 72px; font-weight: 400; letter-spacing: 6px; color: var(--gold); text-shadow: 0 4px 24px rgba(232, 195, 114, 0.35); line-height: 1.1; }
.tagline { color: #dfe4f2; margin: 12px 0 22px; }
.title-btns { display: flex; flex-direction: column; gap: 10px; align-items: center; }
.title-btns .btn { min-width: 200px; }

/* 开局 */
.setup { max-width: 980px; margin: 0 auto; padding: 28px 16px 60px; }
.sec-title { font-size: 26px; color: var(--gold); margin-bottom: 6px; }
.setup h3 { margin: 22px 0 10px; font-size: 18px; }
.form-row { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 16px; }
.form-row label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
.choice-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.choice-row.two { grid-template-columns: repeat(2, 1fr); }
.choice { text-align: left; border: 1px solid var(--line2); background: var(--panel2); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; transition: border-color 0.15s, transform 0.1s; }
.choice b { font-family: var(--serif); font-size: 16px; color: var(--gold); }
.choice span { color: var(--muted); font-size: 13px; }
.choice:hover { border-color: var(--gold); }
.choice.on { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(232, 195, 114, 0.35) inset; background: #2b3354; }
.choice.evil b { color: #ff9ea0; }
.setup-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 28px; flex-wrap: wrap; }

/* 主界面 */
.game { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(380px, 1fr); grid-template-rows: auto 1fr; height: 100vh; gap: 12px; padding: 12px; }
.topbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px 14px; flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; line-height: 1.25; }
.brand b { font-family: var(--serif); font-size: 20px; color: var(--gold); }
.brand span { font-size: 12.5px; color: var(--muted); }
.res { display: flex; gap: 6px 14px; flex-wrap: wrap; flex: 1; }
.res .r { display: flex; flex-direction: column; line-height: 1.15; font-weight: 700; font-variant-numeric: tabular-nums; }
.res .r em { font-style: normal; font-weight: 400; font-size: 11px; color: var(--muted); }
.top-btns { display: flex; gap: 8px; align-items: center; }
.ai-chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line2); color: var(--muted); }
.ai-chip.on { color: var(--jade); border-color: rgba(95, 211, 179, 0.5); }
.left { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.right { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }

/* 地图 */
.map { position: relative; flex: none; aspect-ratio: 1000 / 620; width: min(100%, calc((100vh - 250px) * 1000 / 620)); margin: 0 auto; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow); }
.overview { flex: 1; min-height: 0; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px 14px; align-content: start; font-size: 13.5px; }
.overview .ov { display: flex; flex-direction: column; }
.overview .ov b { font-size: 12px; color: var(--muted); font-weight: 400; }
.overview .ov span { font-weight: 500; }
.overview .ov.bad span { color: #ffb3b1; }
.overview .ov.good span { color: var(--jade); }
.map-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.hall-name { font-family: var(--serif); font-size: 16px; fill: #f6e9cb; }
.hall-name.main { font-size: 20px; fill: #fff3cf; paint-order: stroke; stroke: rgba(60, 20, 20, 0.6); stroke-width: 4px; }
.lantern { animation: glow 2.4s ease-in-out infinite alternate; }
@keyframes glow { from { opacity: 0.55; } to { opacity: 1; } }
.clouds { animation: drift 40s linear infinite alternate; }
@keyframes drift { from { transform: translateX(-30px); } to { transform: translateX(40px); } }
.hall-hit { position: absolute; width: 9%; height: 13%; transform: translate(-50%, -40%); background: transparent; border: 0; border-radius: 12px; }
.hall-hit:hover { background: rgba(232, 195, 114, 0.12); outline: 1px dashed rgba(232, 195, 114, 0.5); }
.pins { position: absolute; inset: 0; pointer-events: none; }
.pin { position: absolute; transform: translate(-50%, -50%); pointer-events: auto; background: none; border: 0; padding: 0; animation: bob 2.6s ease-in-out infinite; }
.pin .ava { border-radius: 50%; box-shadow: 0 3px 8px rgba(0, 0, 0, 0.45); border: 2px solid rgba(255, 255, 255, 0.85); }
.pin.master .ava { border-color: var(--gold); width: 42px; height: 42px; }
.pin .pin-name { position: absolute; left: 50%; top: 100%; transform: translateX(-50%); white-space: nowrap; font-size: 11px; background: rgba(10, 13, 25, 0.8); padding: 0 6px; border-radius: 6px; opacity: 0; transition: opacity 0.15s; }
.pin:hover .pin-name, .pin:focus-visible .pin-name { opacity: 1; }
.pin .star { position: absolute; right: -4px; top: -6px; color: var(--gold); font-style: normal; font-size: 13px; text-shadow: 0 0 4px #000; }
.pin .flag { position: absolute; left: -6px; top: -6px; font-style: normal; font-size: 10px; background: var(--red); color: #fff; border-radius: 6px; padding: 0 3px; }
@keyframes bob { 0%, 100% { margin-top: 0; } 50% { margin-top: -3px; } }
.away { position: absolute; left: 10px; bottom: 10px; font-size: 12.5px; background: rgba(10, 13, 25, 0.75); padding: 4px 10px; border-radius: 8px; }

.advance { display: flex; flex-direction: column; gap: 8px; }
.advance .next { width: 100%; }
.advance .next small { color: #5a4316; font-size: 12px; font-weight: 400; }
.banner { background: rgba(232, 195, 114, 0.12); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.banner.bad { background: rgba(239, 111, 108, 0.14); border-color: rgba(239, 111, 108, 0.5); }

/* 标签页 */
.tabs { display: flex; border-bottom: 1px solid var(--line); background: rgba(0, 0, 0, 0.15); }
.tab { flex: 1; background: none; border: 0; padding: 11px 4px; color: var(--muted); font-size: 15px; position: relative; border-bottom: 2px solid transparent; }
.tab.on { color: var(--gold); border-bottom-color: var(--gold); font-weight: 700; }
.tab .dot { position: absolute; top: 4px; right: 8%; background: var(--red); color: #fff; font-size: 10.5px; font-style: normal; border-radius: 999px; padding: 0 5px; line-height: 16px; }
.tab .dot.soft { background: var(--blue); }
.panel { flex: 1; overflow-y: auto; padding: 14px 16px 30px; }
.h { font-size: 16px; color: var(--gold); margin: 14px 0 8px; }
.h.small { font-size: 13px; color: var(--muted); }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 10px; }

/* 季报 */
.report { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.report.old { opacity: 0.75; }
.ri { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 10px; background: rgba(255, 255, 255, 0.035); border-left: 3px solid var(--line2); }
.ri p { margin: 0; }
.ri.good { border-left-color: var(--jade); }
.ri.bad { border-left-color: var(--red); }
.ri.story { border-left-color: var(--violet); }
.ri.big { background: rgba(232, 195, 114, 0.08); }
.ri-dot { width: 30px; height: 30px; flex: none; }
.ri blockquote { margin: 4px 0 0; font-family: var(--serif); color: #f3e3bd; font-size: 14px; }
.ri cite { color: var(--muted); font-style: normal; font-size: 12px; margin-left: 4px; }
.ava-btn { background: none; border: 0; padding: 0; flex: none; }
.ava { display: block; border-radius: 12px; flex: none; }
.decision { background: linear-gradient(180deg, rgba(232, 195, 114, 0.1), rgba(232, 195, 114, 0.03)); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; }
.decision p { margin: 6px 0; }
.d-head { display: flex; align-items: center; gap: 8px; }
.d-head h4 { font-size: 16px; }
.d-opts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

/* 弟子 */
.roster { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.roster li { display: flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, 0.035); border-radius: 12px; padding: 6px 8px; }
.roster-main { display: flex; gap: 10px; align-items: center; background: none; border: 0; text-align: left; flex: 1; min-width: 0; padding: 0; }
.rm-text { display: flex; flex-direction: column; min-width: 0; }
.rm-text small { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rm-text .wish { color: #d9c9a2; }
.rm-side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.meters { display: flex; gap: 4px; }
.meters .bar { width: 26px; }
.star-btn { background: none; border: 0; font-size: 18px; color: rgba(255, 255, 255, 0.2); padding: 0 2px; }
.star-btn.on { color: var(--gold); }
.sort { font-size: 13px; color: var(--muted); }

/* 人事 */
.warn { background: rgba(239, 111, 108, 0.1); border: 1px solid rgba(239, 111, 108, 0.35); border-radius: 10px; padding: 8px 10px; font-size: 13.5px; margin: 8px 0; }
.idle { margin: 8px 0; font-size: 13.5px; }
.halls { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.hall-card { background: rgba(255, 255, 255, 0.04); border: 1px solid var(--line2); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.hall-card h4 { font-size: 16px; color: var(--gold); display: flex; justify-content: space-between; }
.hall-card h4 small { color: var(--gold2); letter-spacing: 1px; }
.head-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 13.5px; }
.head-row select { flex: 1; min-width: 120px; }
.crew { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 2px; }
.crew li { display: inline-flex; align-items: center; }
.x { background: none; border: 0; color: var(--muted); padding: 0 4px; }
.x:hover { color: var(--red); }
.pill-rule { margin-top: 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; }
.pill-rule small { color: var(--muted); width: 100%; }

/* 招募 */
.cand { background: rgba(255, 255, 255, 0.04); border: 1px solid var(--line2); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
.cand p { margin: 4px 0; font-size: 14px; }
.cand-top { display: flex; gap: 12px; align-items: center; }
.cand h4 { font-size: 17px; }
.cand h4 small { font-family: var(--sans); font-weight: 400; color: var(--muted); font-size: 12.5px; }
.known { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; padding: 8px 10px; background: rgba(0, 0, 0, 0.18); border-radius: 10px; font-size: 13.5px; }
.known select { padding: 2px 6px; font-size: 12.5px; }

/* 宗门 */
.tree { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.branch { display: flex; flex-direction: column; gap: 6px; background: rgba(255, 255, 255, 0.03); border-radius: 10px; padding: 8px; }
.branch > b { font-family: var(--serif); color: var(--gold); }
.node { padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line2); font-size: 13.5px; display: flex; flex-direction: column; }
.node small { color: var(--muted); font-size: 11.5px; }
.node.have { border-color: rgba(95, 211, 179, 0.6); background: rgba(95, 211, 179, 0.1); }
.node.can { border-color: var(--line); }
.node.lock { opacity: 0.45; }
.up-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px; }
.up { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: rgba(255, 255, 255, 0.03); border-radius: 8px; padding: 6px 10px; font-size: 13.5px; }
.up span small { color: var(--muted); margin-left: 6px; }

/* 天下 */
.ranking { padding-left: 20px; margin: 0 0 10px; }
.ranking li { padding: 4px 0; }
.ranking li span { color: var(--muted); font-size: 13px; margin-left: 8px; }
.ranking li.me b { color: var(--gold); }
.rival { border: 1px solid var(--line2); border-left: 4px solid var(--c); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; background: rgba(255, 255, 255, 0.03); }
.rival header { display: flex; gap: 10px; align-items: center; }
.rival h4 { font-size: 17px; }
.rival p { margin: 6px 0; font-size: 14px; }

/* 弹窗 */
.modal-bg { position: fixed; inset: 0; background: rgba(5, 8, 16, 0.65); display: grid; place-items: center; padding: 16px; z-index: 20; backdrop-filter: blur(2px); }
.modal { position: relative; background: linear-gradient(180deg, #1c2440, #141a2e); border: 1px solid var(--line); border-radius: 16px; padding: 20px 22px; width: min(560px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; box-shadow: var(--shadow); }
.modal.wide { width: min(960px, 100%); }
.modal h4 { margin: 14px 0 6px; color: var(--gold); font-size: 15px; }
.close { position: absolute; right: 10px; top: 8px; background: none; border: 0; font-size: 24px; color: var(--muted); line-height: 1; }
.pcard { display: grid; grid-template-columns: 220px 1fr; gap: 20px; }
.pc-left { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.pc-left .ava { border-radius: 22px; box-shadow: var(--shadow); }
.pc-left h3 { font-size: 22px; margin-top: 8px; }
.pc-left p { margin: 2px 0; font-size: 13.5px; }
.meters-big { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.wish-box { background: rgba(232, 195, 114, 0.1); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.wish-box small { display: block; color: var(--muted); }
.quote { font-family: var(--serif); color: #f3e3bd; margin: 8px 0; font-size: 15px; }
.chips { display: flex; flex-wrap: wrap; }
.chips .chip small { display: none; }
.chips .chip:hover small { display: inline; }
.skills { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px 12px; font-size: 13px; }
.skills span { display: flex; align-items: center; gap: 6px; }
.skills em { font-style: normal; width: 30px; color: var(--muted); }
.skills small { color: var(--muted); }
.ties { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 2px 10px; font-size: 13.5px; }
.ties li { display: flex; gap: 6px; align-items: center; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.life { list-style: none; padding: 0; margin: 0; max-height: 280px; overflow-y: auto; border-left: 2px solid var(--line); }
.life li { padding: 3px 0 3px 12px; font-size: 13.5px; position: relative; }
.life li::before { content: ''; position: absolute; left: -5px; top: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--line2); }
.life li.good::before { background: var(--jade); }
.life li.bad::before { background: var(--red); }
.life li.story::before { background: var(--violet); }
.life li.big { font-weight: 700; }
.life time { color: var(--muted); font-size: 11.5px; margin-right: 8px; }
.team { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 4px; }
.team label { display: flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; }
.team .ava { border-radius: 8px; }
.team small { color: var(--muted); }
.chat header { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
.chat-lines { list-style: none; padding: 0; margin: 0 0 10px; max-height: 50vh; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
.chat-lines li { max-width: 80%; padding: 7px 11px; border-radius: 12px; font-size: 14.5px; }
.chat-lines li.me { align-self: flex-end; background: #2d3a64; }
.chat-lines li.them { align-self: flex-start; background: rgba(232, 195, 114, 0.12); font-family: var(--serif); }
.chat-lines li.typing { opacity: 0.75; }
.chat form, .key-form { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
.chat input { flex: 1; }
.key-form label { display: flex; flex-direction: column; gap: 4px; flex: 1; font-size: 13px; color: var(--muted); }
.help { padding-left: 20px; }
.help li { margin-bottom: 8px; }

.busy { position: fixed; inset: 0; background: rgba(5, 8, 16, 0.55); display: grid; place-items: center; z-index: 30; }
.busy-box { background: #1c2440; border: 1px solid var(--line); padding: 20px 26px; border-radius: 14px; text-align: center; max-width: 360px; }
.spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(232, 195, 114, 0.25); border-top-color: var(--gold); margin: 0 auto 10px; animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #262f52; border: 1px solid var(--line); padding: 10px 16px; border-radius: 12px; box-shadow: var(--shadow); z-index: 40; max-width: calc(100vw - 32px); }

/* 窄屏：地图在上，面板在下 */
@container app (max-width: 860px) {
  .game { grid-template-columns: 1fr; grid-template-rows: auto auto auto; height: auto; min-height: 100vh; padding: 8px; gap: 8px; }
  .map { width: 100%; }
  .overview { grid-template-columns: 1fr 1fr; }
  .right { min-height: 70vh; }
  .res { gap: 4px 10px; }
  .top-btns { width: 100%; justify-content: flex-end; }
  .pcard { grid-template-columns: 1fr; }
  .logo { font-size: 54px; }
  .title-box { padding: 26px 18px; }
  .tab { font-size: 14px; }
  .modal { padding: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  .pin, .clouds, .lantern, .spinner { animation: none; }
}

/* 玩法补充：家底增减、新手指引、冲关、召见、结局；修手机上卡片撑出屏幕。 */

/* 顶栏：上一季的增减 */
.res .rv { display: flex; align-items: baseline; gap: 5px; white-space: nowrap; }
.res .dlt { font-size: 11px; font-weight: 500; letter-spacing: 0; }
.res .dlt.up { color: var(--jade); }
.res .dlt.down { color: #f09a97; }

/* 新手指引 */
.guide { margin: 14px 0 6px; padding: 14px 16px; border: 1px solid var(--line); border-left: 3px solid var(--gold); border-radius: 6px; background: linear-gradient(120deg, #d8bb7a14, #d8bb7a03); }
.guide header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.guide header b { font-family: var(--serif); color: var(--gold); letter-spacing: 2px; }
.guide ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.guide li { font-size: 13.5px; line-height: 1.7; }
.guide li > span { margin-right: 8px; }
.guide li.done { color: var(--muted); }
.guide li.done > span { text-decoration: line-through; text-decoration-color: #ffffff44; }
.guide li i { font-style: normal; color: var(--jade); }
.guide li .btn { vertical-align: middle; min-height: 26px; padding: 2px 12px; }

/* 冲关 */
.break-box { margin: 12px 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: 6px; background: #e3ca920f; }
.break-box > b { color: var(--gold); font-family: var(--serif); }
.break-box .d-opts { margin-top: 10px; }

/* 召见 */
.topics { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.topics .btn { flex: 1 1 120px; }
.chat-lines li.note { align-self: center; max-width: 100%; background: transparent; color: var(--muted); font-size: 12.5px; padding: 2px 8px; }
.chat .chat-lines { min-height: 120px; }
.acts .btn small { font-size: 10.5px; }

/* 结局 */
.ending .eyebrow { margin-bottom: 6px; }
.ending .sec-title { font-size: 30px; letter-spacing: 6px; margin-bottom: 8px; }
.end-nums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 16px 0 8px; }
.end-nums div { padding: 10px 12px; border: 1px solid var(--line2); border-radius: 6px; background: #ffffff05; display: flex; flex-direction: column; gap: 2px; }
.end-nums em { font-style: normal; font-size: 11.5px; color: var(--muted); }
.end-nums b { font-size: 15px; }
.fate { margin: 8px 0 12px; }
.fate > b { display: block; font-size: 13px; margin-bottom: 6px; }
.fate .chips { gap: 6px; }
.fate .chips .chip small { display: inline; }
.annals { max-height: 300px; }

/* 手机：过季按钮浮在底部导航上面 */
.fab-next { display: none; }

/* 卡片里的下拉框不许把卡片撑出屏幕 */
.halls > *, .hall-card, .cand, .rival, .decision { min-width: 0; }
.hall-card select, .head-row select, .cand select, .acts select { max-width: 100%; min-width: 0; }

@container app (max-width: 860px) {
  .fab-next {
    display: flex; align-items: center; gap: 6px; position: fixed; right: 14px; bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 16;
    padding: 12px 20px; border-radius: 999px; border: 1px solid #ecdbaf; background: linear-gradient(135deg, #ead7a8, #c5ab72); color: #24312b;
    font: 700 15px/1 var(--serif); letter-spacing: 3px; box-shadow: 0 6px 20px #0007;
  }
  .fab-next i { font-style: normal; font-size: 11px; letter-spacing: 0; background: var(--red); color: #fff; border-radius: 999px; padding: 2px 6px; }
  body:has(.modal-bg) .fab-next { display: none; }
  .toast { max-width: calc(100vw - 32px); white-space: normal; text-align: center; }
  .end-nums { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .head-row select { flex-basis: 100%; }
}

/* 宗主亲为 */
.master-card { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: #16282a; border: 1px solid var(--line2); border-radius: 8px; }
.master-card .mc-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.master-card .mc-text b { font-family: var(--serif); color: var(--gold); font-size: 14px; }
.master-card .mc-text small { color: var(--muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.master-card .bar { width: 80px; }
.choice-row > div.choice select, .choice-row > div.choice .btn { margin-top: 6px; width: 100%; }

/* 宗门任务 */
.mission { padding: 14px 16px; border: 1px solid var(--line2); border-radius: 6px; background: #ffffff03; margin-bottom: 12px; min-width: 0; }
.mission header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.mission h4 { color: var(--gold); font-size: 16px; }
.mission p { margin: 6px 0; }
.danger { color: #f09a97; letter-spacing: 2px; font-size: 12px; white-space: nowrap; }
.team-pick { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.team-pick select { flex: 1 1 180px; max-width: 100%; min-width: 0; }
.exp-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 10px 12px; border: 1px dashed var(--line); border-radius: 6px; margin-bottom: 8px; }
.exp-row b { color: var(--gold); font-family: var(--serif); }
.exp-row small { margin-left: auto; }

/* 品阶、回顾 */
.reqs { list-style: none; padding: 0; margin: 6px 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
.reqs li { display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px; border: 1px solid var(--line2); border-radius: 5px; font-size: 13px; }
.reqs li b { font-variant-numeric: tabular-nums; }
.reqs li.ok { border-color: #8ed4b955; color: var(--jade); }
.review { margin: 4px 0 14px; padding: 12px 14px; border: 1px solid var(--line2); border-radius: 6px; background: #ffffff04; }
.review h4 { margin-bottom: 6px; }
.review .end-nums { grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 8px 0 0; }
.review .end-nums div { padding: 6px 8px; }
@container app (max-width: 600px) { .review .end-nums { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* 手机横屏：左边山门和过季，右边事务，顶栏压成一行 */
@container app (orientation: landscape) and (max-height: 540px) {
  .game { display: grid; grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.05fr); grid-template-rows: auto minmax(0, 1fr); height: 100dvh; min-height: 0; gap: 6px; padding: 6px max(8px, env(safe-area-inset-right)) 6px max(8px, env(safe-area-inset-left)); }
  .topbar { grid-column: 1 / -1; flex-wrap: nowrap; padding: 6px 10px; gap: 10px; border-top-width: 1px; }
  .brand { padding-right: 10px; gap: 0; border-right: 1px solid var(--line); flex: none; }
  .brand b { font-size: 16px; letter-spacing: 1px; }
  .brand span { font-size: 10.5px; }
  .res { display: flex; flex: 1 1 auto; flex-basis: auto; order: 0; flex-wrap: nowrap; gap: 12px; overflow-x: auto; border-top: 0; padding-top: 0; scrollbar-width: none; }
  .res::-webkit-scrollbar { display: none; }
  .res .r { font-size: 14px; gap: 0; flex: none; }
  .res .r em { font-size: 10px; }
  .top-btns { flex: none; width: auto; gap: 4px; flex-wrap: nowrap; }
  .top-btns .btn { min-height: 30px; padding: 4px 8px; font-size: 12px; }
  .ai-chip { display: none; }
  .left { overflow-y: auto; overflow-x: hidden; padding: 0 2px 0 0; gap: 6px; min-height: 0; }
  .section-heading, .map-note { display: none; }
  /* 地图按比例缩小，让宗主和概况露出来 */
  .map { width: min(100%, calc(46dvh * 1000 / 620)); margin: 0 auto; flex-shrink: 0; }
  .overview { grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 4px; }
  .overview .ov { padding: 6px 8px; line-height: 1.5; }
  .master-card { padding: 6px 8px; }
  .advance { position: sticky; bottom: 0; padding: 6px; gap: 4px; }
  .advance .next { min-height: 40px; padding: 6px 10px; }
  .advance-note { display: none; }
  .banner { padding: 6px 8px; }
  .right { min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
  .tabs { position: static; padding: 0 4px; border-top: 0; border-bottom: 1px solid var(--line); box-shadow: none; background: #142527; z-index: auto; }
  .tab { min-height: 38px; padding: 6px 2px; font-size: 13px; border-top: 0; border-bottom: 2px solid transparent; }
  .tab.on { border-bottom-color: var(--gold); border-top-color: transparent; }
  .tab .dot { top: 1px; }
  .panel-heading { display: none; }
  .panel { overflow-y: auto; padding: 4px 12px 16px; }
  .fab-next { display: none !important; }
  .modal-bg { padding: 6px; }
  .modal { max-height: calc(100dvh - 12px); padding: 14px 18px; }
  .pcard { grid-template-columns: 190px minmax(0, 1fr); gap: 16px; }
  .pc-left { border-right: 1px solid var(--line2); border-bottom: 0; padding: 4px 8px 0 0; }
  .pc-left .ava { width: 96px; height: 96px; }
  .pc-right > :first-child { margin-right: 34px; }
  .choice-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .toast { bottom: 12px; }
  .title-screen { padding: 16px 40px; min-height: 100dvh; }
  .title-box { padding: 6px 0; }
  .logo { font-size: 42px; line-height: 1.2; }
  .eyebrow { margin-bottom: 6px; }
  .tagline { margin: 8px 0 14px; line-height: 1.8; }
  .title-btns { flex-direction: row; flex-wrap: wrap; max-width: none; }
  .title-btns .btn { min-width: 0; min-height: 40px; }
  .title-box > .fine { margin-top: 10px; }
  .setup { padding: 14px 20px 20px; }
  .setup-btns { position: static; }
  .chat .chat-lines { max-height: 38dvh; min-height: 60px; }
}

/* 营造：空地、在建 */
.hall-name.dim { fill: #cdd6cf; opacity: .8; }
.hall.plot.building path { animation: none; }
.hall-card.empty { border-style: dashed; background: transparent; }
.hall-card.empty h4 small { color: var(--muted); letter-spacing: 0; }
.up.empty { border-style: dashed; }
.building { color: var(--gold); }
.fate-nums small { display: block; color: var(--muted); font-size: 11.5px; line-height: 1.6; margin-top: 2px; }

/* ───────── 横屏骨架：顶栏 + 左菜单 + 山门场景 + 右抽屉 ───────── */
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
body { position: fixed; inset: 0; margin: 0; }
#app { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; transform-origin: 0 0; overflow: hidden; container: app / size; }
html.rot body { touch-action: none; }
:root { --app-w: 100vw; --app-h: 100vh; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* 转过来以后，视口单位不准，统一用游戏实际宽高 */
.title-screen { height: 100%; min-height: 0 !important; overflow: auto; }
.setup { height: 100%; overflow: auto; }
.modal { max-height: calc(var(--app-h) - 24px) !important; }
.modal-bg { z-index: 60 !important; }
.toast { z-index: 80 !important; max-width: calc(var(--app-w) - 32px) !important; bottom: auto !important; top: 58px; }
.g .toast { top: auto; bottom: 10px !important; font-size: 14px; padding: 7px 14px; max-width: 46% !important; text-align: center; }
@container app (max-height: 520px) { .g .toast { font-size: 12.5px; padding: 5px 12px; bottom: 6px !important; } }
.busy { z-index: 90; }

.g { position: absolute; inset: 0; display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); grid-template-rows: var(--hud-h) minmax(0, 1fr); --hud-h: 48px; --rail-w: 62px; --dw: min(580px, 48%); background: #0d1424; }
@container app (max-height: 520px) { .g { --hud-h: 38px; --rail-w: 52px; --dw: min(560px, 56%); } }

/* ── 顶栏 ── */
.hud { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 0 10px 0 8px; background: linear-gradient(180deg, #121b30, #0e1628); border-bottom: 1px solid var(--line); z-index: 30; min-width: 0; }
.hud-brand { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.1; background: none; border: 0; padding: 0 4px; min-width: 0; }
.hud-brand b { font-family: var(--serif); color: var(--gold); font-size: 17px; white-space: nowrap; }
.hud-brand small { color: var(--muted); font-size: 11px; }
.hud-date { display: grid; grid-template-columns: auto auto; column-gap: 6px; align-items: baseline; line-height: 1.15; position: relative; padding-bottom: 4px; white-space: nowrap; }
.hud-date b { font-family: var(--serif); font-size: 15px; }
.hud-date small { color: var(--muted); font-size: 12px; }
.hud-date .sbar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 2px; background: rgba(255,255,255,.1); overflow: hidden; }
.hud-date .sbar i { display: block; height: 100%; background: linear-gradient(90deg, #7fd3a6, var(--gold)); }
.hud-speed { display: flex; align-items: center; gap: 2px; background: rgba(255,255,255,.05); border: 1px solid var(--line2); border-radius: 10px; padding: 2px; position: relative; }
.hud-speed .sp { width: 34px; height: 28px; border: 0; border-radius: 8px; background: none; color: var(--muted); display: grid; place-items: center; padding: 0; }
.hud-speed .sp svg { width: 15px; height: 15px; fill: currentColor; }
.hud-speed .sp:hover { color: var(--text); background: rgba(255,255,255,.06); }
.hud-speed .sp.on { background: linear-gradient(180deg, #f0cf86, #c99b48); color: #2a1d08; }
.hud-speed.frozen .sp[data-v="0"] { color: var(--gold); animation: pulse 1.2s infinite; }
.frozen-why { position: absolute; left: 50%; top: calc(100% + 6px); transform: translateX(-50%); white-space: nowrap; font-size: 11.5px; color: #2a1d08; background: var(--gold); padding: 2px 9px; border-radius: 99px; pointer-events: none; z-index: 5; box-shadow: 0 4px 12px rgba(0,0,0,.35); }
.hud-res { display: flex; align-items: center; gap: 4px 12px; flex: 1; min-width: 0; overflow: hidden; justify-content: flex-end; }
.hr { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.hr svg { width: 15px; height: 15px; flex: none; }
.hr b { font-size: 14px; }
.hr em { font-style: normal; color: var(--muted); font-size: 11px; }
.hr.low b { color: var(--red); animation: pulse 1s infinite; }
.hud-menu { border: 1px solid var(--line2); background: rgba(255,255,255,.04); border-radius: 8px; width: 34px; height: 30px; font-size: 16px; flex: none; }
@keyframes pulse { 50% { opacity: .45; } }
@container app (max-width: 1100px) { .hr em { display: none; } }
@container app (max-width: 820px) { .hr.armory, .hr.authority, .hr.veins { display: none; } .hud { gap: 8px; } }
@container app (max-width: 640px) { .hud-brand small, .hud-date small { display: none; } .hr.fpills { display: none; } }
@container app (max-height: 520px) { .hud-brand b { font-size: 15px; } .hud-speed .sp { width: 30px; height: 24px; } .hud-date b { font-size: 13.5px; } .hr b { font-size: 13px; } }

/* ── 左菜单 ── */
.rail { grid-row: 2; grid-column: 1; display: flex; flex-direction: column; background: #0e1628; border-right: 1px solid var(--line); z-index: 30; overflow-y: auto; scrollbar-width: none; }
.rail-btn { position: relative; flex: 1 1 0; min-height: 40px; max-height: 76px; border: 0; background: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 2px; font-size: 12px; border-left: 3px solid transparent; }
.rail-btn svg { width: 20px; height: 20px; fill: currentColor; }
.rail-btn:hover { color: var(--text); background: rgba(255,255,255,.04); }
.rail-btn.on { color: var(--gold); border-left-color: var(--gold); background: rgba(232,195,114,.08); }
.rb { position: absolute; top: 4px; right: 6px; min-width: 17px; height: 17px; border-radius: 9px; font-style: normal; font-size: 11px; line-height: 17px; text-align: center; padding: 0 4px; background: rgba(255,255,255,.18); color: var(--text); }
.rb.red { background: var(--red); color: #fff; }
.rb.gold { background: var(--gold); color: #2a1d08; }
@container app (max-height: 520px) { .rail-btn { font-size: 10.5px; gap: 0; } .rail-btn svg { width: 17px; height: 17px; } .rb { top: 1px; right: 2px; } }

/* ── 场景 ── */
.stage { grid-row: 2; grid-column: 2; position: relative; overflow: hidden; }
.scene { position: absolute; inset: 0; overflow: hidden; background: #3a5a8c; user-select: none; -webkit-user-select: none; }
.scene-bg { position: absolute; left: 0; top: 0; width: 2560px; height: 1216px; transform-origin: 0 0; }
.scene-bg svg { width: 2560px; height: 1216px; display: block; }
.sect-title { font-family: 'Ma Shan Zheng', var(--serif); font-size: 30px; fill: rgba(255,255,255,.0); }
.fall-flow { animation: flow 0.9s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -26; } }
.scene-inner { position: absolute; left: 0; top: 0; width: 1280px; height: 576px; transform-origin: 0 0; }
.halls-layer, .toks-layer, .exp-layer, .fx-layer { position: absolute; inset: 0; pointer-events: none; }
.halls-layer > *, .toks-layer > *, .exp-layer > * { pointer-events: auto; }
.scene.shake { animation: shake .45s; }
@keyframes shake { 20% { transform: translate(-6px, 3px); } 40% { transform: translate(5px, -4px); } 60% { transform: translate(-4px, 2px); } 80% { transform: translate(3px, -1px); } }

/* 殿堂 */
.hall-el { position: absolute; width: 0; height: 0; border: 0; padding: 0; background: none; color: inherit; }
.hall-el::before { content: ''; position: absolute; left: -70px; top: -112px; width: 140px; height: 126px; border-radius: 30px; }
.hall-el:hover::before, .hall-el:focus-visible::before { background: radial-gradient(closest-side, rgba(255,240,200,.28), transparent); }
.hall-el .hall-art { position: absolute; left: -110px; top: -130px; overflow: visible; pointer-events: none; }
.plaque { font-family: 'Ma Shan Zheng', var(--serif); font-size: 11px; fill: #f3d27a; }
.hall-label { position: absolute; left: 0; top: 12px; transform: translateX(-50%); white-space: nowrap; font-size: max(13px, calc(10.5px * var(--ui, 1))); line-height: 1.35; padding: 1px .7em; border-radius: 99px; background: rgba(10,14,26,.74); color: #f3e6c4; border: 1px solid rgba(232,195,114,.42); font-family: var(--serif); pointer-events: none; }
.hall-label small { color: var(--gold); margin-left: 3px; font-size: .8em; }
.hall-el.empty .hall-label { color: rgba(243,230,196,.75); border-style: dashed; background: rgba(10,14,26,.5); }
.hall-el.empty::after { content: '+'; position: absolute; left: -14px; top: -40px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; line-height: 1; color: #2a1d08; background: var(--gold); opacity: .0; transition: opacity .2s; }
.hall-el.empty:hover::after { opacity: .9; }
.hall-el.fixed .hall-label { background: rgba(60,20,16,.72); }
.hall-el.glow .cave-mouth { fill: #ffd76a; animation: caveGlow 1.2s ease-in-out infinite alternate; }
@keyframes caveGlow { from { fill: #8a6a2a; } to { fill: #ffe9a8; } }
.hall-prog { position: absolute; left: 0; top: calc(14px + 1.6em); transform: translateX(-50%); width: 120px; display: flex; flex-direction: column; align-items: center; gap: 2px; pointer-events: none; }
.hall-prog i { display: block; height: 7px; border-radius: 4px; background: linear-gradient(90deg, #f0cf86, #ffe9b0); box-shadow: 0 0 8px rgba(240,207,134,.6); align-self: flex-start; transition: width .4s linear; }
.hall-prog::before { content: ''; position: absolute; top: 0; left: 0; width: 120px; height: 7px; border-radius: 4px; background: rgba(10,14,26,.6); z-index: -1; }
.hall-prog em { font-style: normal; font-size: max(12px, calc(10px * var(--ui, 1))); color: #fff3d0; text-shadow: 0 1px 3px #000; white-space: nowrap; }
.rising { transition: clip-path .4s linear; }
.scaffold { animation: tap 0.6s steps(2) infinite; }
@keyframes tap { 50% { transform: translateY(-1px); } }
.smoke circle { fill: rgba(240,240,250,.75); animation: smoke 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
.smoke circle:nth-child(2) { animation-delay: .8s; } .smoke circle:nth-child(3) { animation-delay: 1.6s; }
@keyframes smoke { from { transform: translateY(6px) scale(.4); opacity: .9; } to { transform: translateY(-26px) scale(1.4); opacity: 0; } }
.sparks circle { fill: #ffb347; animation: smoke 1.1s ease-out infinite; transform-box: fill-box; }
.sparks circle:nth-child(2) { animation-delay: .35s; } .sparks circle:nth-child(3) { animation-delay: .7s; }
.flag path { animation: flag 1.6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: left center; }
.flag.f2 path { transform-origin: right center; }
@keyframes flag { to { transform: scaleX(.82) skewY(4deg); } }
.lantern ellipse { animation: lamp 2s ease-in-out infinite alternate; }
@keyframes lamp { to { fill: #ffd27a; } }

/* 人 */
.tok { position: absolute; left: 0; top: 0; width: 0; height: 0; border: 0; padding: 0; background: none; color: inherit; transition: opacity .5s; will-change: transform; }
.tok-body { position: absolute; left: -23px; top: -50px; width: 46px; height: 46px; transform: scale(var(--tk, 1)); transform-origin: 50% 100%; border-radius: 14px; box-shadow: 0 0 0 2px rgba(255,255,255,.75), 0 4px 10px rgba(0,0,0,.45); }
.tok-body .ava { width: 46px; height: 46px; border-radius: 13px; }
.tok-body.master { box-shadow: 0 0 0 3px var(--gold), 0 0 16px rgba(232,195,114,.7); }
.tok-body.guest { box-shadow: 0 0 0 2px rgba(180,190,210,.7), 0 4px 10px rgba(0,0,0,.4); filter: saturate(.6); }
.tok::after { content: ''; position: absolute; left: -16px; top: -6px; width: 32px; height: 9px; border-radius: 50%; background: rgba(0,0,0,.28); }
.tok-name { position: absolute; left: 0; top: 2px; transform: translateX(-50%); white-space: nowrap; font-size: max(12px, calc(9.5px * var(--ui, 1))); color: #fff; text-shadow: 0 1px 2px #000, 0 0 4px #000; pointer-events: none; }
.tok-badge { position: absolute; left: calc(14px * var(--tk, 1)); top: calc(-54px * var(--tk, 1)); font-style: normal; font-size: max(11px, calc(9px * var(--ui, 1))); line-height: 1; padding: 3px 4px; border-radius: 6px; background: #2b3354; color: #fff; border: 1px solid rgba(255,255,255,.4); font-family: var(--serif); }
.tok-badge.jade { background: #2f8a6e; } .tok-badge.gold { background: #b98a2f; } .tok-badge.red { background: #b5443f; } .tok-badge.gray { background: #5b6276; } .tok-badge.pink { background: #b8557e; } .tok-badge.blue { background: #3b6ab0; }
.tok-star { position: absolute; left: calc(-28px * var(--tk, 1)); top: calc(-56px * var(--tk, 1)); font-style: normal; color: var(--gold); font-size: max(13px, calc(10px * var(--ui, 1))); text-shadow: 0 0 4px #000; }
.tok-bar { position: absolute; left: calc(-18px * var(--tk, 1)); top: calc(-5px * var(--tk, 1)); width: calc(36px * var(--tk, 1)); height: 3px; border-radius: 2px; background: rgba(0,0,0,.45); overflow: hidden; pointer-events: none; }
.tok-bar i { display: block; height: 100%; background: #f3d27a; }
.tok.walk .tok-body { animation: walk .32s ease-in-out infinite alternate; }
@keyframes walk { from { transform: scale(var(--tk, 1)) translateY(0) rotate(-3deg); } to { transform: scale(var(--tk, 1)) translateY(-4px) rotate(3deg); } }
.tok.gone { opacity: 0; pointer-events: none; }
.tok.breaking .tok-body { box-shadow: 0 0 0 3px #ffe08a, 0 0 22px 6px rgba(255,214,106,.75); animation: aura 1.1s ease-in-out infinite alternate; }
@keyframes aura { to { box-shadow: 0 0 0 3px #fff4c8, 0 0 34px 12px rgba(255,214,106,.9); } }
.tok.stuck .tok-body { box-shadow: 0 0 0 2px #ffe08a, 0 0 12px 2px rgba(255,214,106,.6); }
.tok:hover .tok-body, .tok:focus-visible .tok-body { box-shadow: 0 0 0 3px #fff, 0 6px 14px rgba(0,0,0,.5); }
.bubble { position: absolute; left: 0; bottom: calc(52px * var(--tk, 1) + 6px); transform: translateX(-50%); width: max-content; max-width: max(170px, calc(150px * var(--ui, 1))); padding: .45em .75em; border-radius: 12px; background: #fffaf0; color: #2a2016; font-size: max(13px, calc(11px * var(--ui, 1))); line-height: 1.35; box-shadow: 0 6px 16px rgba(0,0,0,.35); animation: bubble 5.2s ease forwards; pointer-events: none; z-index: 2; text-align: left; }
.bubble::after { content: ''; position: absolute; left: 50%; bottom: -6px; margin-left: -6px; border: 6px solid transparent; border-bottom: 0; border-top-color: #fffaf0; }
.bubble.b-left { transform: translateX(-18%); animation-name: bubbleL; } .bubble.b-left::after { left: 18%; }
.bubble.b-right { transform: translateX(-82%); animation-name: bubbleR; } .bubble.b-right::after { left: 82%; }
@keyframes bubbleL { 0% { opacity: 0; transform: translateX(-18%) translateY(6px); } 6% { opacity: 1; transform: translateX(-18%); } 88% { opacity: 1; } 100% { opacity: 0; transform: translateX(-18%) translateY(-6px); } }
@keyframes bubbleR { 0% { opacity: 0; transform: translateX(-82%) translateY(6px); } 6% { opacity: 1; transform: translateX(-82%); } 88% { opacity: 1; } 100% { opacity: 0; transform: translateX(-82%) translateY(-6px); } }
@keyframes bubble { 0% { opacity: 0; transform: translateX(-50%) translateY(6px) scale(.9); } 6% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); } 88% { opacity: 1; } 100% { opacity: 0; transform: translateX(-50%) translateY(-6px); } }

/* 在外的队伍 */
.exp-chip { position: absolute; display: flex; align-items: center; gap: 6px; padding: 3px 10px 3px 4px; border-radius: 99px; background: rgba(10,14,26,.78); border: 1px solid rgba(232,195,114,.45); color: #f3e6c4; font-size: max(12px, calc(10px * var(--ui, 1))); white-space: nowrap; transform-origin: 0 50%; }
.exp-faces { display: flex; }
.exp-faces .ava { width: max(18px, calc(16px * var(--ui, 1))); height: max(18px, calc(16px * var(--ui, 1))); border-radius: 50%; margin-right: -5px; box-shadow: 0 0 0 1.5px #0d1424; }
.exp-chip b { font-weight: 500; margin-left: 6px; }
.exp-chip em { font-style: normal; color: var(--gold); }
.exp-bar { width: 44px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.15); overflow: hidden; }
.exp-bar i { display: block; height: 100%; background: var(--gold); }

/* 飘字、光柱 */
.fx { position: absolute; pointer-events: none; }
.fx.float { transform: translateX(-50%); white-space: nowrap; font-weight: 700; font-size: max(14px, calc(12px * var(--ui, 1))); text-shadow: 0 1px 3px #000, 0 0 6px rgba(0,0,0,.6); animation: floatUp 2.6s ease-out forwards; }
.fx.float.good { color: #9ff0b8; } .fx.float.bad { color: #ff9e9a; } .fx.float.gold { color: #ffe08a; } .fx.float.info { color: #e8eefc; }
@keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, 8px); } 12% { opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -46px); } }
.fx.ring { width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; border: 3px solid #ffe08a; animation: ring 1.1s ease-out forwards; }
.fx.ring.big { border-width: 4px; animation-duration: 1.5s; }
@keyframes ring { from { transform: scale(.4); opacity: 1; } to { transform: scale(6); opacity: 0; } }
.fx.beam { width: 70px; height: 900px; margin-left: -35px; margin-top: -880px; background: linear-gradient(180deg, transparent, rgba(255,236,160,.85) 70%, #fff8d8); filter: blur(4px); animation: beam 2.6s ease-out forwards; transform-origin: 50% 100%; }
@keyframes beam { 0% { transform: scaleX(.1); opacity: 0; } 15% { transform: scaleX(1); opacity: 1; } 70% { opacity: .9; } 100% { transform: scaleX(.3); opacity: 0; } }
.fx.shock { width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; border: 5px solid #ff6b5e; animation: ring 1s ease-out forwards; }
.fx.dust { width: 160px; height: 60px; margin: -40px 0 0 -80px; border-radius: 50%; background: radial-gradient(closest-side, rgba(230,214,180,.9), transparent); animation: dust 1.4s ease-out forwards; }
@keyframes dust { from { transform: scale(.5); opacity: 1; } to { transform: scale(1.8); opacity: 0; } }
.flash { position: absolute; inset: 0; pointer-events: none; animation: flash .9s ease-out forwards; z-index: 10; }
.flash.gold { background: radial-gradient(circle at 25% 40%, rgba(255,240,180,.75), rgba(255,240,180,0) 70%); }
@keyframes flash { from { opacity: 1; } to { opacity: 0; } }

/* 天气、云 */
.weather, .clouds-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.weather i { position: absolute; top: -4%; width: 7px; height: 7px; border-radius: 50%; animation: fall linear infinite; opacity: .9; }
.weather.s3 i { background: #fff; box-shadow: 0 0 4px #fff; }
.weather.s0 i { width: 9px; height: 6px; background: #ffc2d4; border-radius: 60% 0; }
.weather.s2 i { width: 10px; height: 7px; background: #e8913c; border-radius: 0 70%; }
.weather.s1 i { top: auto; bottom: 10%; width: 4px; height: 4px; background: #fff6b0; box-shadow: 0 0 8px 2px rgba(255,240,150,.8); animation-name: mote; }
@keyframes fall { from { transform: translate(0, 0) rotate(0); } to { transform: translate(60px, 110vh) rotate(540deg); } }
@keyframes mote { 0% { transform: translate(0,0); opacity: 0; } 30% { opacity: 1; } 100% { transform: translate(40px, -160px); opacity: 0; } }
.cloud { position: absolute; width: 360px; height: 70px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,255,255,.55), rgba(255,255,255,0)); animation: drift 70s linear infinite; }
.cloud.c1 { top: 16%; left: -30%; } .cloud.c2 { top: 30%; left: -50%; animation-duration: 95s; animation-delay: -40s; width: 480px; } .cloud.c3 { top: 8%; left: -40%; animation-duration: 120s; animation-delay: -80s; opacity: .7; }
@keyframes drift { to { transform: translateX(220vw); } }

/* ── 场景四角 ── */
.quest-slot { position: absolute; left: 10px; top: 10px; z-index: 18; max-width: calc(100% - 380px); }
.quest { display: flex; align-items: center; gap: 8px; padding: 5px 6px 5px 10px; border-radius: 12px; background: rgba(10,14,26,.8); border: 1px solid rgba(232,195,114,.5); color: var(--text); font-size: 13.5px; box-shadow: 0 6px 16px rgba(0,0,0,.3); }
.quest b { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.quest .q-n { color: #2a1d08; background: var(--gold); border-radius: 6px; padding: 0 6px; font-size: 12px; white-space: nowrap; }
.quest em { font-style: normal; color: var(--gold); }
.quest.goal { padding-right: 10px; }
.quest.goal.done .q-n { background: var(--jade); }
.q-x { background: none; border: 0; color: var(--muted); font-size: 16px; padding: 0 4px; }
@keyframes slideIn { from { opacity: 0; transform: translateY(-8px); } }
.war-slot { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); z-index: 19; }
.war-count { border: 1px solid #ff8b84; background: rgba(120,24,20,.88); color: #ffe0dc; padding: 5px 14px; border-radius: 99px; font-weight: 700; animation: pulse 1.4s infinite; white-space: nowrap; }
.banner-slot { position: absolute; left: 50%; top: 24%; transform: translateX(-50%); z-index: 25; pointer-events: none; width: max-content; max-width: 86%; transition: left .3s; }
.g.has-letter .banner-slot { left: 30%; max-width: 52%; }
.banner-pop { font-family: var(--serif); font-size: 24px; padding: 10px 26px; border-radius: 14px; text-align: center; color: #fff6dc; background: linear-gradient(90deg, rgba(20,16,10,0), rgba(20,16,10,.82) 15%, rgba(20,16,10,.82) 85%, rgba(20,16,10,0)); text-shadow: 0 2px 8px #000; animation: bannerPop 2.6s ease forwards; letter-spacing: 1px; }
.banner-pop.gold { color: #ffe08a; } .banner-pop.bad { color: #ffaaa4; } .banner-pop.good { color: #a7f0c2; }
@keyframes bannerPop { 0% { opacity: 0; transform: scale(.85); } 10% { opacity: 1; transform: scale(1.04); } 18% { transform: scale(1); } 85% { opacity: 1; } 100% { opacity: 0; transform: translateY(-10px); } }
@container app (max-height: 520px) { .banner-pop { font-size: 18px; padding: 6px 18px; } .quest { font-size: 12.5px; } }

/* 待裁决的信 */
.letters { position: absolute; right: 10px; top: 10px; width: min(340px, 46%); z-index: 22; display: flex; flex-direction: column; gap: 6px; transition: right .25s; }
.g.dw-open .letters { right: calc(var(--dw) + 10px); }
.letter { background: linear-gradient(160deg, #283a3a, #172427); border: 1px solid #b89a5a; border-radius: 12px; padding: 10px 12px; box-shadow: 0 10px 24px rgba(0,0,0,.45); animation: letterIn .35s ease; max-height: calc(var(--app-h) - var(--hud-h) - 90px); overflow: auto; }
.letter.urgent { border-color: var(--red); box-shadow: 0 0 0 1px rgba(239,111,108,.5), 0 10px 24px rgba(0,0,0,.45); }
.letter header { display: flex; align-items: center; gap: 8px; }
.letter header .ava { border-radius: 10px; }
.letter h4 { flex: 1; font-size: 15.5px; color: var(--gold); line-height: 1.3; }
.letter .due { font-size: 12px; color: var(--muted); white-space: nowrap; border: 1px solid var(--line2); border-radius: 99px; padding: 0 7px; }
.letter.urgent .due { color: #ffb3b1; border-color: rgba(239,111,108,.6); }
.letter p { margin: 6px 0 8px; font-size: 13.5px; line-height: 1.55; color: #e3e7f2; }
.l-opts { display: flex; flex-wrap: wrap; gap: 6px; }
.l-opts .btn { flex: 1 1 auto; }
.letter-tabs { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
.lt { border: 1px solid var(--line); background: rgba(14,22,36,.88); color: var(--text); border-radius: 8px; padding: 3px 8px; font-size: 12px; display: inline-flex; gap: 6px; align-items: baseline; }
.lt small { color: var(--muted); }
.lt.urgent { border-color: var(--red); }
@keyframes letterIn { from { opacity: 0; transform: translateX(30px); } }
@container app (max-height: 520px) { .letter { padding: 7px 9px; } .letter p { font-size: 12.5px; margin: 4px 0 6px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; } .letter h4 { font-size: 14px; } .l-opts .btn.sm { padding: 3px 8px; font-size: 12.5px; } .l-opts .btn small { font-size: 10.5px; } }

/* 左下纪事滚动 */
.ticker { position: absolute; left: 10px; bottom: 10px; width: min(440px, 52%); z-index: 15; display: flex; flex-direction: column; gap: 4px; pointer-events: none; }
.tk { pointer-events: auto; display: flex; align-items: flex-start; gap: 7px; text-align: left; border: 0; border-radius: 10px; padding: 4px 9px 4px 5px; background: rgba(8,12,22,.66); color: #eef0f6; font-size: 13px; line-height: 1.4; animation: tkLife 12s ease forwards; border-left: 3px solid rgba(255,255,255,.25); }
.ticker:hover .tk { animation-play-state: paused; opacity: 1 !important; }
@keyframes tkLife { 0% { opacity: 0; transform: translateY(10px); } 4% { opacity: 1; transform: none; } 55% { opacity: 1; } 100% { opacity: .12; } }
.tk .ava { width: 20px; height: 20px; border-radius: 6px; flex: none; }
.tk-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin: 6px 6px 0; flex: none; }
.tk.good { border-left-color: var(--jade); } .tk.bad { border-left-color: var(--red); } .tk.story { border-left-color: var(--violet); }
.tk.big span { font-weight: 700; }
.tk q { display: block; color: #ffe8b0; font-style: italic; }
.tk q::before { content: '「'; } .tk q::after { content: '」'; }
@container app (max-height: 520px) { .tk { font-size: 11.5px; padding: 2px 7px 2px 4px; animation-duration: 8s; } .tk:nth-child(-n+3) { display: none; } .ticker { width: min(380px, 44%); bottom: 6px; } .tk q { display: inline; margin-left: 4px; } }

/* 右下宗主 */
.master-slot { position: absolute; right: 10px; bottom: 10px; z-index: 16; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; transition: opacity .2s; }
.g.dw-open .master-slot { opacity: 0; pointer-events: none; }
.mb { display: flex; align-items: center; gap: 8px; padding: 5px 10px 5px 5px; border-radius: 14px; background: rgba(10,14,26,.82); border: 1px solid rgba(232,195,114,.55); color: var(--text); text-align: left; box-shadow: 0 6px 16px rgba(0,0,0,.35); }
.mb-ava .ava { border-radius: 10px; }
.mb-text { display: flex; flex-direction: column; line-height: 1.3; min-width: 130px; }
.mb-text b { font-family: var(--serif); color: var(--gold); font-size: 14px; }
.mb-text small { color: var(--muted); font-size: 11.5px; }
.mb-bar { display: block; height: 4px; border-radius: 2px; background: rgba(255,255,255,.12); margin-top: 3px; overflow: hidden; }
.mb-bar i { display: block; height: 100%; background: linear-gradient(90deg, #7fd3a6, var(--gold)); }
.mb-cultiv { width: 6px; height: 34px; border-radius: 3px; background: rgba(255,255,255,.12); display: flex; align-items: flex-end; overflow: hidden; }
.mb-cultiv i { display: block; width: 100%; background: #f3d27a; }
.mb-note { font-size: 11.5px; color: #2a1d08; background: var(--gold); padding: 1px 8px; border-radius: 99px; }
@container app (max-height: 520px) { .master-slot { right: 6px; bottom: 6px; } .mb { padding: 3px 8px 3px 3px; gap: 6px; } .mb-text { min-width: 96px; } .mb-text b { font-size: 12px; } .mb-text small { font-size: 10.5px; } .mb .ava { width: 26px; height: 26px; } .mb-cultiv { height: 26px; } .mb-note { font-size: 10.5px; } }

/* ── 右抽屉 ── */
.drawer { position: absolute; top: var(--hud-h); right: 0; bottom: 0; width: var(--dw); z-index: 40; display: flex; flex-direction: column; background: linear-gradient(180deg, #172a2b, #101c20); border-left: 1px solid #8d845f; box-shadow: -14px 0 30px rgba(0,0,0,.4); transform: translateX(104%); transition: transform .25s ease; visibility: hidden; }
.g.dw-open .drawer { transform: none; visibility: visible; }
.dw-head { display: flex; align-items: baseline; gap: 10px; padding: 10px 50px 8px 16px; border-bottom: 1px solid var(--line2); position: relative; }
.dw-head h2 { font-size: 19px; color: var(--gold); }
.dw-sub { color: var(--muted); font-size: 12px; }
.dw-head .close { top: 2px; right: 4px; }
.dw-body { flex: 1; overflow-y: auto; padding: 8px 16px 24px; overscroll-behavior: contain; scrollbar-width: thin; }
.dw-body .halls { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)) !important; }
.dw-body .choice-row { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)) !important; }
@container app (max-height: 520px) { .dw-head { padding: 6px 46px 5px 12px; } .dw-head h2 { font-size: 16px; } .dw-sub { display: none; } .dw-body { padding: 6px 12px 18px; font-size: 14px; } }

/* 竖着拿手机时提示一下 */
html.rot .g::after { content: ''; }

@media (prefers-reduced-motion: reduce) {
  .weather, .clouds-layer { display: none; }
  .tok.walk .tok-body, .bubble, .fx { animation-duration: .01s !important; }
}

/* 开春弹窗：短屏上来历压成一行小字，选项排成三列 */
.modal .fate-nums small { font-size: 12px; }
@container app (max-height: 520px) {
  .modal { padding: 12px 16px !important; }
  .modal .sec-title { font-size: 20px; }
  .modal h3 { font-size: 16px; margin: 8px 0 4px; }
  .modal .choice-row { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; gap: 6px; }
  .modal .choice { padding: 7px 10px; }
  .modal .choice b { font-size: 14px; }
  .modal .choice span { font-size: 12px; line-height: 1.4; }
  .modal .review { padding: 8px 10px; margin-top: 8px; }
  .modal .fate-nums small { display: none; }
  .modal .end-nums div { padding: 6px 8px; }
  .modal .muted { font-size: 12.5px; margin: 2px 0 6px; }
}

      <li><b>事情要花时间。</b>盖殿堂一两个月，脚手架一点点长高；派人下山办差事一两个月才回来；弟子冲关要进洞闭关十五天才出结果；宗主闭关、亲传一季一轮。</li>
